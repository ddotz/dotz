<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121316" media="(prefers-color-scheme: dark)">
<title>좋은 예</title>
<style>
:root { --bg: #ffffff; --card: #f4f5f7; --fg: #1b1d21; --fg-2: #565b63; --accent: #1d5fd1; --on-accent: #ffffff; --accent-2: #1850b0; --ok: #0a7a4b; --err: #b42318; }
@media (prefers-color-scheme: dark) {
	:root { --bg: #121316; --card: #1c1e22; --fg: #f1f2f4; --fg-2: #a6abb3; --accent: #7aaeff; --accent-2: #9bc0ff; --on-accent: #0b1220; --ok: #4cc38a; --err: #ff8a80; }
}
body { margin: 0; min-height: 100dvh; padding: 16px 16px max(16px, env(safe-area-inset-bottom)); background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, sans-serif; }
main { max-width: 32em; margin: 0 auto; }
h1 { font-size: 24px; line-height: 1.3; margin: 0 0 4px; }
.sub { color: var(--fg-2); font-size: 14px; margin: 0 0 16px; }
.card { background: var(--card); border-radius: 12px; padding: 16px; margin: 0 0 16px; }
.row { display: flex; align-items: center; gap: 12px; min-height: 44px; }
.row + .row { margin-top: 8px; }
.dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.dot.ok { background: var(--ok); }
.dot.err { background: var(--err); }
.grow { flex: 1; }
.time { color: var(--fg-2); font-size: 14px; }
.btn { min-height: 44px; min-width: 44px; padding: 0 16px; border: 0; border-radius: 8px; background: var(--accent); color: var(--on-accent); font: inherit; font-weight: 600; transition: transform 160ms ease-out, background-color 160ms ease-out; }
.btn:active { transform: scale(0.97); }
@media (hover: hover) and (pointer: fine) { .btn:hover { background: var(--accent-2); } }
@media (prefers-reduced-motion: reduce) { .btn { transition: none; } }
.field { box-sizing: border-box; width: 100%; min-height: 44px; margin: 0 0 16px; padding: 0 12px; border: 1px solid var(--fg-2); border-radius: 8px; background: var(--bg); color: var(--fg); font: inherit; }
.ic { width: 20px; height: 20px; flex: none; stroke: var(--fg-2); }
a { color: var(--fg); }
a.nav { display: inline-flex; align-items: center; min-height: 44px; }
</style>
</head>
<body>
<main>
	<h1>오늘 할 일 3건</h1>
	<p class="sub">마지막 확인 오전 8:40 · 새로 온 것이 없어요. 자세한 내용은 <a href="#log">활동 기록</a>에서 볼 수 있어요.</p>
	<div class="card">
		<div class="row"><span class="dot ok" role="img" aria-label="정상"></span><span class="grow">백업 서버</span><span class="time">8:12</span></div>
		<div class="row"><span class="dot err" role="img" aria-label="실패"></span><span class="grow">메일 동기화</span><span class="time">어제</span></div>
		<div class="row"><svg class="ic" viewBox="0 0 20 20" fill="none" stroke-width="2" aria-hidden="true"><path d="M4 10h12M10 4v12"/></svg><span class="grow">새 파일 12개</span><span class="time">방금</span></div>
	</div>
	<input class="field" type="search" aria-label="활동 검색" placeholder="활동 검색">
	<button class="btn" type="button">지금 다시 시도</button>
	<p><a class="nav" href="#log">활동 기록 보기</a></p>
</main>
</body>
</html>
