<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="dotz">
  <!-- the site brand mark (site/index.html .brand-mark, web/css/01-tokens.css .logo): big dots top-left and bottom-right, small ones top-right and bottom-left; only the bottom-right dot takes the accent. The PNG icons are its dark version on a full-bleed tile. -->
  <style>
    .t { fill: #121214; }
    .f { fill: #ececf0; }
    .a { fill: #4c94ff; }
    @media (prefers-color-scheme: light) {
      .t { fill: #f2f4f6; }
      .f { fill: #191f28; }
      .a { fill: #3182f6; }
    }
  </style>
  <rect class="t" width="32" height="32" rx="7"/>
  <circle class="f" cx="10.75" cy="10.75" r="3.54"/>
  <circle class="f" cx="21.25" cy="10.75" r="2.17"/>
  <circle class="f" cx="10.75" cy="21.25" r="2.17"/>
  <circle class="a" cx="21.25" cy="21.25" r="3.54"/>
</svg>
