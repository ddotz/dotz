<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f2f4f6">
<title>dotz</title>
<script>
// Theme is applied before first paint: the saved light/dark choice, else the system setting (read only until the first toggle).
(() => {
  const mq = matchMedia("(prefers-color-scheme: dark)");
  const saved = () => { const v = localStorage.getItem("dotz-theme"); return v === "light" || v === "dark" ? v : null; };
  const get = () => saved() || (mq.matches ? "dark" : "light");
  const apply = () => {
    const dark = get() === "dark";
    document.documentElement.dataset.theme = dark ? "dark" : "light";
    const m = document.querySelector('meta[name="theme-color"]');
    if (m) m.content = dark ? "#121214" : "#f2f4f6";
    window.dispatchEvent(new Event("dotz-theme"));
  };
  mq.addEventListener("change", apply);
  window.dotzTheme = { get, toggle: () => { localStorage.setItem("dotz-theme", get() === "dark" ? "light" : "dark"); apply(); return get(); } };
  apply();
})();
</script>
<style>
/* Toss-tone tokens (see web/DESIGN.md): gray canvas, borderless white cards, one sparing blue accent, big bold titles */
:root {
  color-scheme: light;
  --bg: #f2f4f6; --side: #f2f4f6; --card: #ffffff; --pop: #ffffff;
  --layer: #f2f4f6; --hover: #e9ecf0; --active: #e5e8eb; --track: #e5e8eb;
  --card-hover: #f9fafb;
  --line: #e5e8eb; --line-2: #d1d6db;
  --fg: #191f28; --fg-2: #4e5968; --fg-3: #6b7684;
  --accent: #3182f6; --on-accent: #ffffff;
  --ok: #0a8754; --warn: #b85e00; --err: #e42939;
  --r-card: 18px; --r-ctl: 10px;
  --scrim: rgb(0 0 0 / .4);
  --float: 0 8px 24px rgb(0 0 0 / .10), 0 1px 3px rgb(0 0 0 / .06);
  /* terminal panel: dark in both themes */
  --tb: #101012; --tf: #e6e6ea; --td: #8d8d96; --tl2: #2b2b30; --tok: #4ade80; --terr: #ff7b7b; --tac: #a9a9ff;
  --font: Pretendard, "Pretendard Variable", -apple-system, BlinkMacSystemFont, system-ui, "Apple SD Gothic Neo", "Noto Sans KR", "Segoe UI", sans-serif;
  --mono: ui-monospace, "SF Mono", "Geist Mono", SFMono-Regular, Menlo, Consolas, monospace;
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #121214; --side: #121214; --card: #1d1d21; --pop: #26262b;
  --layer: #26262b; --hover: #2b2b31; --active: #303036; --track: #34343b;
  --card-hover: #232328;
  --line: #2b2b31; --line-2: #3d3d45;
  --fg: #ececf0; --fg-2: #b0b4bc; --fg-3: #8e939c;
  --accent: #4c94ff; --on-accent: #ffffff;
  --ok: #3ecf8e; --warn: #f5a524; --err: #ff6369;
  --scrim: rgb(0 0 0 / .6);
  --float: 0 8px 24px rgb(0 0 0 / .5), 0 1px 3px rgb(0 0 0 / .4);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; scrollbar-width: thin; scrollbar-color: var(--line-2) transparent; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { font: 400 14px/22px var(--font); font-variant-numeric: tabular-nums; font-feature-settings: "cv11", "ss01"; -webkit-font-smoothing: antialiased; background: var(--bg); color: var(--fg); overflow: hidden; -webkit-text-size-adjust: 100%; }
button, input, textarea { font: inherit; color: inherit; letter-spacing: inherit; }
button { cursor: pointer; }
code, pre { font-family: var(--mono); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
svg.ic { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; flex: none; }
button:disabled { opacity: .4; cursor: default; pointer-events: none; }
kbd { display: inline-block; flex: none; padding: 0 5px; border: 1px solid var(--line-2); border-radius: 4px; background: var(--layer); color: var(--fg-3); font: 500 11px/16px var(--font); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* layout: sidebar (wide) / bottom bar (phone) */
.app { display: grid; grid-template-columns: 216px minmax(0, 1fr); height: 100vh; height: 100dvh; }
.side { display: flex; flex-direction: column; min-width: 0; min-height: 0; padding: 12px 8px; background: var(--side); border-right: 0; }
.brand { display: flex; align-items: center; gap: 8px; width: 100%; height: 32px; padding: 0 8px; border: 0; border-radius: 6px; background: transparent; color: inherit; font: inherit; font-size: 13px; font-weight: 600; letter-spacing: -.01em; text-align: left; cursor: pointer; }
.brand:hover { background: var(--card); }
.brand span:last-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.logo { position: relative; flex: none; width: 16px; height: 16px; border-radius: 5px; background: var(--fg); }
.logo::after { content: ""; position: absolute; inset: 5px; border-radius: 50%; background: var(--bg); }
.cmdk { display: flex; align-items: center; gap: 8px; width: 100%; height: 32px; margin: 8px 0 12px; padding: 0 6px 0 10px; border: 0; border-radius: var(--r-ctl); background: var(--card); color: var(--fg-3); text-align: left; }
.cmdk:hover { background: var(--card-hover); }
.cmdk .tx { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rail { display: flex; flex-direction: column; gap: 2px; }
.ni { position: relative; display: flex; align-items: center; gap: 8px; width: 100%; height: 32px; padding: 0 8px; border: 0; border-radius: 6px; background: transparent; color: var(--fg-2); font-size: 13px; font-weight: 500; text-align: left; }
.ni:hover { background: var(--hover); color: var(--fg); }
.ni.on { background: var(--card); color: var(--fg); font-weight: 600; }
.ni .nl { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ni .nnb { margin-left: auto; background: var(--warn); }
.sfoot { display: flex; align-items: center; gap: 8px; margin-top: auto; padding: 8px; color: var(--fg-2); font-size: 12px; }
.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.appbar { flex: none; display: flex; align-items: center; gap: 4px; height: calc(48px + env(safe-area-inset-top)); padding: env(safe-area-inset-top) 12px 0 24px; border-bottom: 0; background: var(--bg); }
.appbar.back { padding-left: 12px; }
.appbar { height: calc(60px + env(safe-area-inset-top)); }
.appbar h1 { flex: 1; min-width: 0; margin: 0; font: 700 22px/30px var(--font); letter-spacing: -.02em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.conn { flex: none; height: 20px; padding: 0 8px; border-radius: 10px; background: color-mix(in srgb, var(--err) 14%, transparent); color: var(--err); font-size: 12px; line-height: 20px; font-weight: 500; white-space: nowrap; }
.ustrip { flex: none; display: inline-flex; align-items: center; gap: 8px; height: 28px; padding: 0 8px; border: 0; border-radius: 6px; background: transparent; color: var(--fg-2); font-size: 12px; line-height: 16px; white-space: nowrap; }
.ustrip:hover { background: var(--hover); color: var(--fg); }
.ustrip .ubar { width: 48px; height: 4px; border-radius: 2px; background: var(--track); overflow: hidden; }
.ustrip .ubar i { display: block; height: 100%; border-radius: 2px; background: var(--fg-2); }
.ustrip.warn { color: var(--warn); } .ustrip.warn .ubar i { background: var(--warn); }
.ustrip.err { color: var(--err); } .ustrip.err .ubar i { background: var(--err); }
.ustrip .uring, .ustrip .upct { display: none; }
.ustrip .uring { width: 18px; height: 18px; border-radius: 50%; background: conic-gradient(var(--fg-2) calc(var(--p) * 1%), var(--track) 0); -webkit-mask: radial-gradient(circle, transparent 5px, #000 6px); mask: radial-gradient(circle, transparent 5px, #000 6px); }
.ustrip.warn .uring { background: conic-gradient(var(--warn) calc(var(--p) * 1%), var(--track) 0); }
.ustrip.err .uring { background: conic-gradient(var(--err) calc(var(--p) * 1%), var(--track) 0); }
.views { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; }
.view { max-width: 920px; margin: 0 auto; padding: 24px; }
.view.fill { height: 100%; display: flex; flex-direction: column; padding-bottom: 0; }
.only-phone { display: none !important; }
@media (max-width: 639px) {
  .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto; }
  .main { order: 1; }
  .side { order: 2; flex-direction: row; padding: 0 0 env(safe-area-inset-bottom); border-right: 0; border-top: 1px solid var(--line); background: var(--card); }
  .appbar { height: calc(52px + env(safe-area-inset-top)); }
  .appbar h1 { font-size: 20px; line-height: 28px; }
  .brand, .cmdk, .sfoot { display: none; }
  .rail { flex: 1; min-width: 0; flex-direction: row; gap: 0; }
  .ni { flex: 1 1 0; min-width: 0; flex-direction: column; justify-content: center; gap: 2px; height: 52px; padding: 0 2px; border-radius: 0; background: transparent !important; font-size: 10.5px; line-height: 14px; text-align: center; }
  .ni .ic { width: 18px; height: 18px; }
  .ni .nnb { position: absolute; top: 3px; left: calc(50% + 4px); margin: 0; }
  .ustrip { gap: 4px; padding: 0 4px; font-size: 11px; }
  .ustrip .ulab, .ustrip .ubar { display: none; }
  .ustrip .uring, .ustrip .upct { display: inline-block; }
  .ni.on::before { content: ""; position: absolute; top: -1px; left: 25%; right: 25%; height: 2px; border-radius: 0 0 2px 2px; background: var(--accent); }
  .appbar { padding-left: 16px; }
  .only-phone { display: inline-grid !important; }
  .view { padding: 16px 12px 24px; }
  .view.fill { padding-bottom: 0; }
}

/* buttons */
.ib { display: inline-grid; place-items: center; flex: none; width: 28px; height: 28px; border: 0; border-radius: 6px; background: transparent; color: var(--fg-2); padding: 0; }
.ib:hover { background: var(--hover); color: var(--fg); }
.ib.pri { background: var(--accent); color: var(--on-accent); border-radius: 50%; }
.ib.pri:hover { background: var(--accent); opacity: .88; }
.ib.err { color: var(--err); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 32px; padding: 0 14px; border: 1px solid var(--accent); border-radius: var(--r-ctl); background: var(--accent); color: var(--on-accent); font-size: 14px; line-height: 20px; font-weight: 600; text-decoration: none; white-space: nowrap; max-width: 100%; }
.btn:hover { opacity: .85; }
.btn.tonal, .btn.outlined { background: var(--layer); color: var(--fg); border-color: transparent; }
.btn.tonal:hover, .btn.outlined:hover { background: var(--hover); opacity: 1; }
.btn.text { background: transparent; border-color: transparent; color: var(--fg-2); padding: 0 8px; }
.btn.text:hover { background: var(--hover); color: var(--fg); opacity: 1; }
.btn.danger { background: transparent; border-color: transparent; color: var(--err); padding: 0 8px; }
.btn.danger:hover { background: color-mix(in srgb, var(--err) 12%, transparent); opacity: 1; }
.btn.danger.fill { background: var(--err); border-color: var(--err); color: #fff; padding: 0 12px; }
.btns { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
@media (pointer: coarse) { .ib { width: 36px; height: 36px; } .btn { height: 36px; } .ni { min-height: 44px; } }

/* cards, lists, tags, bars */
.col { display: flex; flex-direction: column; gap: 12px; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 12px; }
.card { position: relative; min-width: 0; border: 0; border-radius: var(--r-card); background: var(--card); padding: 20px; }
.card.tap { cursor: pointer; transition: background .15s; }
.card.tap:hover { background: var(--card-hover); }
.card.tap:focus-visible { outline-offset: 0; }
.ch { display: flex; align-items: center; gap: 8px; min-height: 20px; margin-bottom: 12px; }
.ch h3 { flex: 1; min-width: 0; margin: 0; font: 600 16px/22px var(--font); letter-spacing: -.01em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ch .chev { width: 14px; height: 14px; color: var(--fg-3); }
.card.tap:hover .chev { color: var(--fg); }
.big { font: 700 20px/28px var(--font); letter-spacing: -.01em; overflow-wrap: anywhere; }
.sup { color: var(--fg-2); font-size: 12px; line-height: 16px; overflow-wrap: anywhere; }
.err-t { color: var(--err); }
.muted { color: var(--fg-2); }
.empty { padding: 32px 16px; text-align: center; color: var(--fg-3); font-size: 12px; }
.dot { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--fg-3); }
.dot.ok { background: var(--ok); } .dot.warn { background: var(--warn); } .dot.err { background: var(--err); }
.dot.pri { background: var(--accent); animation: pulse 1.4s ease-in-out infinite; }
.dot.att { background: var(--warn); }
@keyframes pulse { 50% { opacity: .35; } }
.tag { display: inline-flex; align-items: center; flex: none; height: 20px; padding: 0 6px; border-radius: 4px; background: var(--layer); color: var(--fg-2); font-size: 11px; line-height: 16px; font-weight: 500; white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.tag.ok { background: color-mix(in srgb, var(--ok) 14%, transparent); color: var(--ok); }
.tag.warn { background: color-mix(in srgb, var(--warn) 14%, transparent); color: var(--warn); }
.tag.err { background: color-mix(in srgb, var(--err) 14%, transparent); color: var(--err); }
.tag.pri { background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent); }
.row { display: flex; align-items: center; gap: 8px; min-width: 0; }
.row + .row { margin-top: 8px; }
.row .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.kv { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
.kv .k { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.kv .v { flex: none; color: var(--fg-2); font-size: 12px; }
.bar { height: 4px; border-radius: 2px; background: var(--track); overflow: hidden; margin-top: 8px; }
.bar i { display: block; height: 100%; border-radius: 2px; background: var(--bar, var(--accent)); transition: width .3s; }
.bar.warn { --bar: var(--warn); } .bar.err { --bar: var(--err); }
.lim + .lim { margin-top: 12px; }
.more { margin-top: 12px; color: var(--fg-3); font-size: 12px; }
.sec { margin: 28px 4px 10px; color: var(--fg-2); font: 600 14px/20px var(--font); }
.sec:first-child { margin-top: 0; }
.list { border: 0; border-radius: var(--r-card); background: var(--card); overflow: hidden; }
.list > * + * { border-top: 1px solid var(--line); }
.li { display: flex; align-items: center; gap: 12px; min-width: 0; min-height: 48px; padding: 10px 16px; color: inherit; text-align: left; width: 100%; border: 0; background: transparent; }
button.li:hover, .li.tap:hover { background: var(--card-hover); }
.li .lead { flex: none; display: inline-flex; color: var(--fg-3); }
.li .tx { flex: 1; min-width: 0; }
.li .hd { font-size: 15px; line-height: 22px; font-weight: 500; overflow-wrap: anywhere; }
.li.prow { flex-wrap: wrap; }
.li.prow .tx { flex: 1 1 140px; }
.avatar { flex: none; display: grid; place-items: center; width: 24px; height: 24px; border-radius: 6px; background: var(--layer); border: 1px solid var(--line); color: var(--fg-2); font: 600 11px/16px var(--font); text-transform: uppercase; }
.heads { display: flex; align-items: center; gap: 8px; min-width: 0; }
.heads .t { min-width: 0; font: 600 13px/20px var(--font); overflow-wrap: anywhere; }
.sp { flex: 1; }
.clamp { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.pickbox { display: flex; flex-direction: column; gap: 16px; max-height: min(46dvh, 340px); overflow-y: auto; margin: 0 -4px; padding: 0 4px; }
.kb:empty { display: none; }
.li.on { background: var(--active); }
.li.off, .li.off:hover { background: transparent; cursor: default; }
.li.off .hd, .li.off .lead { color: var(--fg-3); }
.rt-roles { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.rt-roles .seg { flex: none; flex-wrap: nowrap; }
.rt-roles .seg button { flex: none; padding: 0 10px; }
.rt-rows { max-height: min(48dvh, 400px); overflow-y: auto; }
.rt-row { padding: 8px 12px; min-width: 0; }
.rt-row .top { display: flex; align-items: center; gap: 6px; min-width: 0; }
.rt-row .nm { min-width: 0; color: var(--fg); font-size: 13px; line-height: 20px; font-weight: 500; overflow-wrap: anywhere; }
.rt-row .sup { margin-top: 2px; }
.tools-bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
.tools-bar .sec { margin: 0; }
.sub { margin-top: 4px; }
.mt8 { margin-top: 8px; } .mt12 { margin-top: 12px; }

/* tabs */
.chips { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; padding: 0 0 12px; min-width: 0; flex: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { display: inline-flex; align-items: center; gap: 6px; flex: none; height: 28px; padding: 0 12px; border: 0; border-radius: 16px; background: var(--card); color: var(--fg-2); font-size: 13px; font-weight: 500; max-width: 100%; }
.chip:hover { background: var(--hover); color: var(--fg); }
.chip.on { background: var(--fg); color: var(--bg); }
.chip .tx { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* settings: model fallback chains. One color token per layer (orchestrator / lanes / task workers); the model in use is filled. */
/* one neutral ink for every layer (blue is kept for the model in use) */
:root { --fb-orch: var(--fg-2); --fb-lane: var(--fg-2); --fb-work: var(--fg-2); }
.fb { margin-top: 24px; }
.fb-note { margin: 4px 0 12px; color: var(--fb-fg, var(--fg-3)); font-size: 12px; line-height: 18px; }
.fb-card { border: 0; border-radius: var(--r-card); background: var(--card); }
.fb-row { display: flex; flex-direction: column; gap: 8px; padding: 12px; }
.fb-row + .fb-row { border-top: 1px solid var(--line); }
.fb-head { display: flex; align-items: center; gap: 8px; color: var(--fb); font-weight: 600; }
.fb-head .sup { color: var(--fg-3); font-weight: 400; }
.fb-chain { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 4px; }
.fb-arrow { align-self: center; color: var(--fg-3); }
.fb-item { position: relative; display: flex; flex-direction: column; gap: 4px; min-width: 132px; max-width: 280px; padding: 6px 8px 6px 10px; border: 1px solid color-mix(in srgb, var(--fb) 34%, transparent); border-radius: 8px; background: color-mix(in srgb, var(--fb) 9%, var(--card)); color: var(--fb); touch-action: none; user-select: none; }
.fb-item[data-i] { cursor: grab; }
.fb-item.in-use { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.fb-item.drag { z-index: 5; cursor: grabbing; box-shadow: var(--float); opacity: .92; }
.fb-item.over { outline: 2px dashed var(--fb); outline-offset: 2px; }
.fb-top { display: flex; align-items: center; gap: 6px; min-width: 0; }
.fb-top .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.fb-use { flex: none; height: 16px; padding: 0 5px; border-radius: 8px; background: color-mix(in srgb, var(--bg) 24%, transparent); font-size: 10px; line-height: 16px; font-weight: 600; }
.fb-base { flex: none; height: 16px; padding: 0 5px; border-radius: 8px; background: color-mix(in srgb, var(--fb) 14%, transparent); font-size: 10px; line-height: 16px; font-weight: 600; }
.fb-item.in-use .fb-base { background: color-mix(in srgb, var(--bg) 24%, transparent); }
.fb-tags { display: flex; flex-wrap: wrap; gap: 3px; }
.fb-tags .tag { height: 18px; line-height: 14px; font-size: 10.5px; background: color-mix(in srgb, var(--fb) 14%, transparent); color: inherit; }
.fb-item.in-use .fb-tags .tag { background: color-mix(in srgb, var(--bg) 22%, transparent); }
.fb-tags .tag.warn { background: color-mix(in srgb, var(--warn) 18%, var(--card)); color: var(--warn); }
.fb-bar { height: 4px; border-radius: 2px; background: color-mix(in srgb, currentColor 18%, transparent); overflow: hidden; }
.fb-bar i { display: block; height: 100%; border-radius: 2px; background: currentColor; }
.fb-bar-l { font-size: 10.5px; line-height: 14px; opacity: .85; }
.fb-acts { display: flex; align-items: center; gap: 0; margin-left: auto; flex: none; }
.fb-acts button { display: inline-grid; place-items: center; width: 20px; height: 20px; padding: 0; border: 0; border-radius: 10px; background: transparent; color: inherit; opacity: .75; }
.fb-acts button:hover, .fb-acts button:focus-visible { opacity: 1; background: color-mix(in srgb, currentColor 16%, transparent); }
.fb-acts button:disabled { opacity: .25; }
.fb-acts .ic { width: 13px; height: 13px; }
.fb-add { align-self: center; display: inline-flex; align-items: center; gap: 4px; height: 32px; padding: 0 12px 0 8px; border: 1px dashed color-mix(in srgb, var(--fb) 55%, transparent); border-radius: 16px; background: transparent; color: var(--fb); font-size: 12px; font-weight: 500; }
.fb-add:hover { background: color-mix(in srgb, var(--fb) 10%, transparent); }

/* fields */
.tf { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.tf > label, .tf > .lb { font: 500 12px/16px var(--font); color: var(--fg-2); }
.fi, .sel { display: flex; align-items: center; gap: 8px; width: 100%; height: 36px; padding: 0 12px; border: 1px solid var(--line-2); border-radius: var(--r-ctl); background: var(--card); outline: 0; font-size: 13px; text-align: left; }
.fi { min-width: 0; }
.fi::placeholder { color: var(--fg-3); }

/* menu: the single dropdown component */

.pal-list { padding: 4px; overflow-y: auto; max-height: 360px; }
.pal-i { display: flex; align-items: center; gap: 8px; width: 100%; min-height: 32px; padding: 4px 8px; border: 0; border-radius: 6px; background: transparent; color: var(--fg); text-align: left; }
.pal-i.on { background: var(--hover); }
.pal-i .ic { color: var(--fg-3); }
.pal-i .nm { flex: none; max-width: 60%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pal-i .pd { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--fg-3); font-size: 12px; }

.snack { position: fixed; z-index: 2000; left: 50%; bottom: 16px; transform: translateX(-50%); width: max-content; max-width: calc(100vw - 24px); padding: 8px 12px; border-radius: 8px; background: var(--fg); color: var(--bg); font-size: 13px; line-height: 20px; overflow-wrap: anywhere; }

/* floating notices (alert / worklog / lane report events) */

/* target header: one switcher + 대화/터미널 toggle, shared by both views */

/* chat: Material 3 type scale + tonal surfaces, one reading column.
   - message text = M3 body-large 16px (line-height 26px: 24px is tuned for Latin, Hangul needs a little more air); meta = label-medium 12/16; tool rows = body-medium 13/20
   - measure capped at 40em of the 16px text (640px = 40 Hangul glyphs = ~65ch measured on "0", inside the 60-75ch band)
   - turn separation by spacing (32px between turns, 16px inside one), no rules or colored stripes
   - owner = right-aligned tonal bubble (--active, M3 surface-container-highest); answers = unboxed text;
     lane reports and alerts = tonal card (--layer + hairline); work in between folds into one quiet summary row
   - secondary text uses --fg-2 (AA on both themes); --fg-3 stays for non-text only */
.chatbox { position: relative; flex: 1; min-height: 0; }

@media (max-width: 639px) { .lw-s { padding-left: 16px; } }

.um:first-child { margin-top: 0; }

.ub { padding: 10px 16px; border-radius: 20px 20px 6px 20px; background: var(--card); font-size: 15px; line-height: 24px; white-space: pre-wrap; overflow-wrap: anywhere; }
.cont > .mt { display: none; }
.bm.cont { margin-top: -4px; }

.bm .more > summary { width: fit-content; color: var(--fg-2); font-size: 13px; line-height: 20px; cursor: pointer; list-style: none; text-decoration: underline; text-underline-offset: 3px; }

.gban { flex: none; display: flex; align-items: center; gap: 10px; width: calc(100% - 48px); max-width: 872px; margin: 0 auto 4px; padding: 8px 8px 8px 14px; border-radius: 12px; background: var(--card); color: var(--fg-2); font-size: 13px; line-height: 20px; }

@media (max-width: 639px) { .gban { width: calc(100% - 24px); } }
.bm .md { max-width: 40em; font-size: 15px; line-height: 26px; }

.md p { margin: 0 0 6px; } .md p:last-child { margin-bottom: 0; }
.md ul, .md ol { margin: 0 0 6px; padding-left: 20px; }

details.work > summary { display: flex; align-items: center; gap: 8px; width: fit-content; max-width: 100%; min-height: 28px; margin-left: -4px; padding: 0 8px 0 4px; border-radius: 8px; color: var(--fg-2); font-size: 13px; line-height: 20px; cursor: pointer; list-style: none; }

<div class="app" id="app">

// Lights up what a node connects to: the other ends get an outline, and (pointer devices) its edges are drawn over the
// cards with their labels. Called with the hovered/focused node, or the selected one when nothing is hovered.
function hOverlay(id) {
  const svg = hOv;
  if ((svg.dataset.hot || "") === (id || "")) return;
  svg.dataset.hot = id || "";
  for (const c of [...svg.querySelectorAll("path.hm-edge, text")]) c.remove();
  for (const b of hNodeEls.values()) b.classList.remove("rel");
  if (!id) return;
  const box = svg.parentNode.getBoundingClientRect();
  const at = e => { const r = e.getBoundingClientRect(); return { l: r.left - box.left, t: r.top - box.top, r: r.right - box.left, b: r.bottom - box.top }; };
  for (const e of HG.edges) {
    if (e.from !== id && e.to !== id) continue;
    const other = hNodeEls.get(e.from === id ? e.to : e.from);
    if (other) other.classList.add("rel");
    const ea = hGeo.get(e.from), eb = hGeo.get(e.to);
    if (H_MQ.matches || !ea || !eb) continue;
    const a = at(ea), b = at(eb);
    let x1, y1, x2, y2, d;
    if (a.r < b.l - 6 || b.r < a.l - 6) {
      const fwd = a.r < b.l - 6;
      x1 = fwd ? a.r : a.l; x2 = fwd ? b.l : b.r; y1 = (a.t + a.b) / 2; y2 = (b.t + b.b) / 2;
      const dx = Math.max(24, Math.abs(x2 - x1) / 2) * (x2 > x1 ? 1 : -1);
      d = `M${x1} ${y1}C${x1 + dx} ${y1} ${x2 - dx} ${y2} ${x2} ${y2}`;
    } else {
      const down = a.t < b.t;
      x1 = (a.l + a.r) / 2; x2 = (b.l + b.r) / 2; y1 = down ? a.b : a.t; y2 = down ? b.t : b.b;
      const dy = Math.max(16, Math.abs(y2 - y1) / 2) * (down ? 1 : -1);
      d = `M${x1} ${y1}C${x1} ${y1 + dy} ${x2} ${y2 - dy} ${x2} ${y2}`;
    }
    svg.append(hSvg("path", { d, class: "hm-edge hot", "marker-end": "url(#hm-ov-ah)" }));
    if (a.r >= b.l - 6 && b.r >= a.l - 6) continue;   // inside one card: the line speaks for itself (the sheet's 이어진 곳 has the label)
    const t = hSvg("text", { x: (x1 + x2) / 2, y: (y1 + y2) / 2 + 3.5, class: "hm-lb hot", "text-anchor": "middle" });
    t.textContent = e.label;
    svg.append(t);
  }
}

// Compact line diff (LCS on the lines between the common head and tail) as unified-diff hunks with `ctx` lines of context,
// plus the changed spans in old-file line numbers for the oversize summary.
function lineDiff(oldText, newText, ctx = 3) {
  const a = oldText.replace(/\r\n/g, "\n").split("\n"), b = newText.replace(/\r\n/g, "\n").split("\n");
  let p = 0;
  while (p < a.length && p < b.length && a[p] === b[p]) p++;
  let q = 0;
  while (q < a.length - p && q < b.length - p && a[a.length - 1 - q] === b[b.length - 1 - q]) q++;
  const am = a.slice(p, a.length - q), bm = b.slice(p, b.length - q), n = am.length, m = bm.length, mid = [];
  if (n * m <= 2_000_000) {
    const w = m + 1, L = new Uint32Array((n + 1) * w);
    for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) L[i * w + j] = am[i] === bm[j] ? L[(i + 1) * w + j + 1] + 1 : Math.max(L[(i + 1) * w + j], L[i * w + j + 1]);
    let i = 0, j = 0;
    while (i < n && j < m) {
      if (am[i] === bm[j]) { mid.push([" ", am[i]]); i++; j++; }
      else if (L[(i + 1) * w + j] >= L[i * w + j + 1]) mid.push(["-", am[i++]]);
      else mid.push(["+", bm[j++]]);
    }
    while (i < n) mid.push(["-", am[i++]]);
    while (j < m) mid.push(["+", bm[j++]]);
  } else {
    for (const s of am) mid.push(["-", s]);
    for (const s of bm) mid.push(["+", s]);
  }
  const ops = [...a.slice(0, p).map(s => [" ", s]), ...mid, ...a.slice(a.length - q).map(s => [" ", s])];
  const ob = [], nb = [], ch = [];
  let o = 0, w2 = 0, add = 0, del = 0;
  ops.forEach(([t], i) => { ob.push(o); nb.push(w2); if (t !== "+") o++; if (t !== "-") w2++; if (t !== " ") ch.push(i); if (t === "+") add++; if (t === "-") del++; });
  const groups = [];
  for (const i of ch) {
    const lo = Math.max(0, i - ctx), hi = Math.min(ops.length - 1, i + ctx), g = groups[groups.length - 1];
    if (g && lo <= g[1] + 1) g[1] = Math.max(g[1], hi); else groups.push([lo, hi]);
  }
  const text = groups.map(([lo, hi]) => {
    const seg = ops.slice(lo, hi + 1), oc = seg.filter(x => x[0] !== "+").length, nc = seg.filter(x => x[0] !== "-").length;
    return [`@@ -${oc ? ob[lo] + 1 : ob[lo]},${oc} +${nc ? nb[lo] + 1 : nb[lo]},${nc} @@`, ...seg.map(([t, s]) => t + s)].join("\n");
  }).join("\n");
  const spans = [];
  for (let k = 0; k < ch.length;) {
    let e = k;
    while (e + 1 < ch.length && ch[e + 1] === ch[e] + 1) e++;
    const seg = ops.slice(ch[k], ch[e] + 1), d = seg.filter(x => x[0] === "-").length, ad = seg.length - d, s0 = ob[ch[k]];
    spans.push(d ? `${d === 1 ? `${s0 + 1}줄` : `${s0 + 1}-${s0 + d}줄`}${ad ? ` (${ad}줄로 교체)` : " 삭제"}` : `${s0}줄 뒤에 ${ad}줄 추가`);
    k = e + 1;
  }
  return { add, del, text, spans };
}

// The message for a prompt-file edit: a compact diff (or, past H_DIFF_CAP characters, only the changed line ranges),
// the optional note, and a note-only form when the draft is unchanged.
const H_DIFF_CAP = 6000;
function hFileRequest(r, orig, draft, note) {
  const head = `${r.label} (${r.path || r.name}) 수정${note ? `\n메모: ${note}` : ""}`;
  if (orig.replace(/\r\n/g, "\n") === draft.replace(/\r\n/g, "\n")) return `${head}\n파일 내용은 바꾸지 않았어요. 메모대로 파일을 직접 고쳐 주세요. 적용 시점: ${r.note}`;
  const d = lineDiff(orig, draft);
  const body = d.text.length <= H_DIFF_CAP
    ? `아래 diff 대로 파일을 고쳐 주세요 (줄 단위, 앞뒤 3줄 맥락 포함).\n\`\`\`diff\n--- ${r.name}\n+++ ${r.name} (수정안)\n${d.text}\n\`\`\``
    : `변경이 커서 diff 는 생략했어요 (+${d.add}줄 -${d.del}줄). 바뀐 곳(원본 줄 기준): ${d.spans.slice(0, 20).join(", ")}${d.spans.length > 20 ? ` 외 ${d.spans.length - 20}곳` : ""}. 파일을 직접 열어 확인하고 메모대로 고쳐 주세요.`;
  return `${head}\n${body}\n적용 시점: ${r.note}`;
}

// Prompt-file editor: the owner edits a draft and asks the orchestrator to apply it (diff + optional note), or sends only
// a note. The file itself is never written from here.
function hFileEditor(n, drafts, line) {
  const ta = el("textarea", { class: "fi hs-ta hs-mono", rows: 18, spellcheck: "false", "aria-label": n.file });
  ta.readOnly = !n.fileEditable;
  const note = n.fileEditable ? el("input", { class: "fi", type: "text", autocomplete: "off", maxlength: 500, placeholder: "무엇을 왜 바꾸는지 (선택) · 글은 두고 메모만 보내도 돼요", "aria-label": "수정 요청 메모" }) : null;
  const info = el("div", { class: "note" }), stat = el("div", { class: "note" });
  const send = el("button", { class: "btn", type: "button", disabled: true }, `${botName}에게 수정 요청`);
  const undo = el("button", { class: "btn text", type: "button", disabled: true }, "되돌리기");
  let file = null, orig = "", sentKey = "", dt = 0;
  const key = () => `${ta.value}\u0000${note ? note.value.trim() : ""}`;
  const dirty = () => ta.value !== orig;
  const unsent = () => (dirty() || (!!note && note.value.trim() !== "")) && key() !== sentKey;
  const mark = () => { send.disabled = !file || !n.fileEditable || !unsent(); undo.disabled = !dirty(); };
  const paintStat = () => {
    if (sentKey && key() === sentKey) return;
    stat.className = "note";
    if (!dirty()) { stat.textContent = ""; return; }
    const d = lineDiff(orig, ta.value);
    stat.textContent = `변경 +${d.add}줄 -${d.del}줄${d.text.length > H_DIFF_CAP ? " · 많이 바뀌어서 diff 대신 바뀐 줄 범위만 보내요. 메모에 무엇을 바꾸는지 적어 주세요" : ""}`;
  };
  const edited = () => { mark(); clearTimeout(dt); dt = setTimeout(paintStat, 250); };
  const url = `/api/harness/file/${n.file.split("/").map(enc).join("/")}`;
  ta.addEventListener("input", edited);
  if (note) note.addEventListener("input", edited);
  undo.onclick = () => { ta.value = orig; edited(); };
  send.onclick = async () => {
    send.disabled = true;
    try {
      const at = await hRequest(hFileRequest(file, orig, ta.value, note.value.trim()), hScope("personal", `${hData()}/${file.name}`));
      sentKey = key(); stat.className = "note ok"; stat.textContent = `요청 보냄 · ${at}`;
    } catch (e) { stat.className = "note err"; stat.textContent = e.message; toast(e.message, true); }
    finally { mark(); }
  };
  drafts.push(unsent);
  // Puts the caret on a 1-based line and scrolls the editor there (a hidden copy of the text measures wrapped lines).
  const gotoLine = ln => {
    const lines = ta.value.split("\n"), start = lines.slice(0, ln - 1).reduce((s, l) => s + l.length + 1, 0), end = start + (lines[ln - 1] || "").length;
    const cs = getComputedStyle(ta);
    const mir = el("div", { style: `position:absolute;visibility:hidden;left:-9999px;top:0;box-sizing:border-box;width:${ta.clientWidth}px;padding:${cs.padding};font-family:${cs.fontFamily};font-size:${cs.fontSize};line-height:${cs.lineHeight};white-space:pre-wrap;overflow-wrap:break-word` });
    const at = el("span", { text: "\u200b" });
    mir.append(ta.value.slice(0, start), at); document.body.append(mir);
    const top = at.offsetTop; mir.remove();
    ta.closest(".hs-fw").scrollIntoView({ block: "start" });
    ta.focus({ preventScroll: true }); ta.setSelectionRange(start, end);
    ta.scrollTop = Math.max(0, top - 60);
  };
  hGoto = gotoLine;
  api(url).then(r => {
    file = r; orig = r.text; ta.value = r.text;
    info.textContent = `${num(r.text.length)}자${r.cap ? ` (시작 프롬프트에는 앞 ${num(r.cap)}자까지)` : ""} · ${r.modified ? `${kstStamp(r.modified)} 수정` : "아직 없는 파일"} · ${r.note}`;
    mark();
    if (line) gotoLine(line);
  }, e => { info.className = "note err"; info.textContent = e.message; });
  return el("div", { class: "hs-fw" }, ta, note, el("div", { class: "btns hs-act" }, n.fileEditable ? undo : null, n.fileEditable ? hScopeTag("personal", `${hData()}/${n.file}`) : null, n.fileEditable ? send : null), info, stat);
}

// A switch only asks: it sends "<name> 끄기/켜기 (<source>)" to the orchestrator and keeps showing the real state until
// the catalog reports the change (the "요청 보냄" tag marks the pending request). With ui.origin_view the request also
// carries its 범위 (개인/배포); a shipped feature folder is turned off by default with a personal override
// (~/.dotz/features/<id>/ with the same id), and the switch offers the shipped repo file as an explicit second choice.
const fcCfgKey = f => (/config\.json:([\w.]+)/.exec(f.source.label) || [])[1];
const fcDirId = f => (/features\/([^/]+)\/feature\.md$/.exec(f.source.label) || [])[1];
const fcCanToggle = f => f.toggleable || (hOrigin() && f.form === "기능 폴더" && !!fcDirId(f));
function fcScopeOf(f) {
  const key = fcCfgKey(f), dir = fcDirId(f);
  if (key) return { kind: "personal", where: `config.json:${key}` };
  if (dir && f.origin === "shipped") return { kind: "personal", where: `${hData()}/features/${dir}/`, override: dir };
  return { kind: f.origin === "shipped" ? "shipped" : "personal", where: f.source.label };
}
const fcAsked = new Map();
function fcSwitch(f) {
  const ask = fcAsked.get(f.id);
  if (ask && ask.to === f.enabled) fcAsked.delete(f.id);
  const pend = fcAsked.get(f.id), word = f.enabled ? "끄기" : "켜기", def = fcScopeOf(f);
  const sw = el("button", { type: "button", class: "hs-sw", role: "switch", "aria-checked": String(f.enabled), "aria-label": `${f.name} ${word} 요청`, title: `${botName}에게 ${word} 요청` });
  const sent = el("span", { class: "tag pri", text: pend ? `요청 보냄 · ${pend.at}` : "", hidden: !pend });
  const tag = hScopeTag(def.kind, def.where, true);
  if (tag && def.override) tag.title = `${hScope(def.kind, def.where)} · 스위치를 누르면 배포 파일 변경 요청도 고를 수 있어요`;
  const post = async choice => {
    const repo = def.override ? `features/${def.override}/feature.md` : f.source.label;
    let { kind, where } = def, text = `${f.name} ${word} (${hOrigin() && def.override ? `배포 기능 ${repo}` : f.source.label})`;
    if (hOrigin() && def.override) {
      if (choice === "shipped") { kind = "shipped"; where = repo; text += `\n배포 저장소의 ${repo} 를 직접 고쳐 주세요 (enabled: ${!f.enabled}). 모든 사용자에게 바뀌는 변경이에요.`; }
      else text += `\n${where} 에 같은 id 로 덮어쓰기: ${repo} 를 그 폴더에 복사해 enabled: ${!f.enabled} 로 두세요. 배포 저장소 파일은 건드리지 마세요.`;
    }
    const at = await hRequest(text, hScope(kind, where));
    fcAsked.set(f.id, { to: !f.enabled, at });
    sent.textContent = `요청 보냄 · ${at}`; sent.hidden = false;
  };
  sw.addEventListener("click", ev => {
    ev.stopPropagation();
    if (hOrigin() && def.override) {
      showMenu(sw, [{ value: "personal", label: "개인 설정으로 덮어쓰기 (기본)", sub: def.where }, { value: "shipped", label: "배포 파일 변경 요청", sub: `features/${def.override}/feature.md · 모든 사용자에게 바뀌어요` }], { value: "personal", onPick: v => busy(sw, () => post(v)) });
      return;
    }
    busy(sw, () => post("personal"));
  });
  return el("span", { class: "fc-sw" }, tag, sent, sw);
}

// A card opens the harness node it works in; text rules open their file editor at the line.

}

// What a card shows: the two-line summary in the user's language when the hub has one (its first line is the name when the

function fcShown(f) {

const fcMatch = f => {

};

function fcPaintList() {

      el("span", { class: "sup", text: `강제 ${fe} · 권고 ${items.length - fe}` }), el("div", { class: "note", text: FC_NOTE[form] || "" }));

H_MQ.addEventListener("change", () => { if (current === "harness") renderHarness(); });
let hW = 0;
window.addEventListener("resize", () => { if (current !== "harness" || H_MQ.matches || !hDetail) return; clearTimeout(hTimer); hTimer = setTimeout(() => { const w = $("#harness").clientWidth; if (Math.abs(w - hW) > 40) { hW = w; renderHarness(); } }, 150); });
setInterval(() => { if (current === "harness" && !document.hidden && !hLoading) loadHarness(true); }, 15000);

/* ---------- boot ---------- */
(async () => {
  const h = parseHash();
  go(h.view || "home", h.t);
  await refreshState();
  loadTarget(target);
  loadModels(true);
  loadProviderData().then(() => { if (current === "home") renderHome(); }, () => {});
  loadSubs(); loadQueue(); loadContext(true).then(renderCtxRing);
  let opened = false;
  const es = new EventSource("/api/events");
  es.onopen = () => {
    setConn(true);
    if (opened) { refreshState(); for (const k of Object.keys(TS)) TS[k].hLoaded = TS[k].aLoaded = false; renderAll(); loadTarget(target); loadSubs(); loadQueue(); laneTailsStale(); }
    opened = true;
  };
  es.onerror = () => setConn(false);
  es.onmessage = m => {
    let e;
    try { e = JSON.parse(m.data); } catch { return; }
    if (e.kind === "activity") { onActivity(e); laneActivity(e); }
    else if (e.kind === "subagents") setSubs(e.source, e.items);
    else if (e.kind === "queue") { QUEUE = e.items || []; renderQueue(); }
    else if (e.kind === "runtime_check") { if (rtLive) rtLive(); }
    else {
      ingestMsg(e); scheduleState();
      // Live notices only (not the replay after a reconnect): alert / worklog posts, the gateway's own notes (sent to the web
      // when Discord is off) and lane reports float in the corner.
      const fresh = !e.ts || Date.now() - Date.parse(e.ts) < 60_000;
      const notice = e.kind === "out" && (e.target === "alert" || e.target === "worklog" || (e.target === "web" && e.source === "gateway"));
      if (fresh && (notice || e.kind === "lane_report")) notify(e);
    }
  };
  setInterval(refreshState, 15000);
  $("#ustrip").onclick = () => go("usage");
  loadStrip(); setInterval(loadStrip, 60000);
  document.addEventListener("visibilitychange", () => { markSeen(); attnChanged(); loadStrip(); });
  setInterval(() => loadModels(true), 60000);
})();
</script>
</body>
</html>
