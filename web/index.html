<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#ffffff">
<title>dotz</title>
<script>
// Theme is applied before first paint: the saved light/dark choice, else the system setting (read only until the first toggle).
(() => {
  const mq = matchMedia("(prefers-color-scheme: dark)");
  const saved = () => { const v = localStorage.getItem("dotz-theme"); return v === "light" || v === "dark" ? v : null; };
  const get = () => saved() || (mq.matches ? "dark" : "light");
  const apply = () => {
    const dark = get() === "dark";
    document.documentElement.dataset.theme = dark ? "dark" : "light";
    const m = document.querySelector('meta[name="theme-color"]');
    if (m) m.content = dark ? "#0a0a0a" : "#ffffff";
    window.dispatchEvent(new Event("dotz-theme"));
  };
  mq.addEventListener("change", apply);
  window.dotzTheme = { get, toggle: () => { localStorage.setItem("dotz-theme", get() === "dark" ? "light" : "dark"); apply(); return get(); } };
  apply();
})();
</script>
<style>
/* neutral monochrome tokens: 1 canvas + 1 raised layer, hairline borders, one accent */
:root {
  color-scheme: light;
  --bg: #ffffff; --side: #fafafa; --card: #ffffff; --pop: #ffffff;
  --layer: #f5f5f5; --hover: #f2f2f2; --active: #ebebeb; --track: #ebebeb;
  --line: #ebebeb; --line-2: #dedede;
  --fg: #171717; --fg-2: #666666; --fg-3: #8a8a8a;
  --accent: #5b5bd6;
  --ok: #18884f; --warn: #b25e00; --err: #d92d20;
  --scrim: rgb(0 0 0 / .4);
  --float: 0 8px 24px rgb(0 0 0 / .10), 0 1px 3px rgb(0 0 0 / .06);
  /* terminal panel: dark in both themes */
  --tb: #101012; --tf: #e6e6ea; --td: #8d8d96; --tl2: #2b2b30; --tok: #4ade80; --terr: #ff7b7b; --tac: #a9a9ff;
  --font: Inter, Geist, system-ui, -apple-system, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  --mono: ui-monospace, "SF Mono", "Geist Mono", SFMono-Regular, Menlo, Consolas, monospace;
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0a0a0a; --side: #0e0e0e; --card: #111111; --pop: #161616;
  --layer: #181818; --hover: #1a1a1a; --active: #222222; --track: #262626;
  --line: #222222; --line-2: #313131;
  --fg: #ededed; --fg-2: #a1a1a1; --fg-3: #858585;
  --accent: #8e8ef0;
  --ok: #3ecf8e; --warn: #f5a524; --err: #ff6369;
  --scrim: rgb(0 0 0 / .6);
  --float: 0 8px 24px rgb(0 0 0 / .5), 0 1px 3px rgb(0 0 0 / .4);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; scrollbar-width: thin; scrollbar-color: var(--line-2) transparent; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { font: 400 13px/20px var(--font); font-variant-numeric: tabular-nums; font-feature-settings: "cv11", "ss01"; -webkit-font-smoothing: antialiased; background: var(--bg); color: var(--fg); overflow: hidden; -webkit-text-size-adjust: 100%; }
button, input, textarea { font: inherit; color: inherit; letter-spacing: inherit; }
button { cursor: pointer; }
code, pre { font-family: var(--mono); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
svg.ic { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; flex: none; }
button:disabled { opacity: .4; cursor: default; pointer-events: none; }
kbd { display: inline-block; flex: none; padding: 0 5px; border: 1px solid var(--line-2); border-radius: 4px; background: var(--layer); color: var(--fg-3); font: 500 11px/16px var(--font); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* layout: sidebar (wide) / bottom bar (phone) */
.app { display: grid; grid-template-columns: 216px minmax(0, 1fr); height: 100vh; height: 100dvh; }
.side { display: flex; flex-direction: column; min-width: 0; min-height: 0; padding: 12px 8px; background: var(--side); border-right: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 8px; font-size: 13px; font-weight: 600; letter-spacing: -.01em; }
.brand span:last-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.logo { position: relative; flex: none; width: 16px; height: 16px; border-radius: 5px; background: var(--fg); }
.logo::after { content: ""; position: absolute; inset: 5px; border-radius: 50%; background: var(--bg); }
.cmdk { display: flex; align-items: center; gap: 8px; width: 100%; height: 32px; margin: 8px 0 12px; padding: 0 6px 0 8px; border: 1px solid var(--line-2); border-radius: 6px; background: var(--card); color: var(--fg-3); text-align: left; }
.cmdk:hover { border-color: var(--fg-3); }
.cmdk .tx { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rail { display: flex; flex-direction: column; gap: 2px; }
.ni { position: relative; display: flex; align-items: center; gap: 8px; width: 100%; height: 32px; padding: 0 8px; border: 0; border-radius: 6px; background: transparent; color: var(--fg-2); font-size: 13px; font-weight: 500; text-align: left; }
.ni:hover { background: var(--hover); color: var(--fg); }
.ni.on { background: var(--active); color: var(--fg); }
.ni .nl { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ni .nnb { margin-left: auto; background: var(--warn); }
.sfoot { display: flex; align-items: center; gap: 8px; margin-top: auto; padding: 8px; color: var(--fg-2); font-size: 12px; }
.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.appbar { flex: none; display: flex; align-items: center; gap: 4px; height: calc(48px + env(safe-area-inset-top)); padding: env(safe-area-inset-top) 12px 0 20px; border-bottom: 1px solid var(--line); background: var(--bg); }
.appbar.back { padding-left: 12px; }
.appbar h1 { flex: 1; min-width: 0; margin: 0; font: 600 13px/20px var(--font); letter-spacing: -.01em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.conn { flex: none; height: 20px; padding: 0 8px; border-radius: 10px; background: color-mix(in srgb, var(--err) 14%, transparent); color: var(--err); font-size: 12px; line-height: 20px; font-weight: 500; white-space: nowrap; }
.ustrip { flex: none; display: inline-flex; align-items: center; gap: 8px; height: 28px; padding: 0 8px; border: 0; border-radius: 6px; background: transparent; color: var(--fg-2); font-size: 12px; line-height: 16px; white-space: nowrap; }
.ustrip:hover { background: var(--hover); color: var(--fg); }
.ustrip .ubar { width: 48px; height: 4px; border-radius: 2px; background: var(--track); overflow: hidden; }
.ustrip .ubar i { display: block; height: 100%; border-radius: 2px; background: var(--fg-2); }
.ustrip.warn { color: var(--warn); } .ustrip.warn .ubar i { background: var(--warn); }
.ustrip.err { color: var(--err); } .ustrip.err .ubar i { background: var(--err); }
.ustrip .uring, .ustrip .upct { display: none; }
.ustrip .uring { width: 18px; height: 18px; border-radius: 50%; background: conic-gradient(var(--fg-2) calc(var(--p) * 1%), var(--track) 0); -webkit-mask: radial-gradient(circle, transparent 5px, #000 6px); mask: radial-gradient(circle, transparent 5px, #000 6px); }
.ustrip.warn .uring { background: conic-gradient(var(--warn) calc(var(--p) * 1%), var(--track) 0); }
.ustrip.err .uring { background: conic-gradient(var(--err) calc(var(--p) * 1%), var(--track) 0); }
.views { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; }
.view { max-width: 920px; margin: 0 auto; padding: 24px; }
.view.fill { height: 100%; display: flex; flex-direction: column; padding-bottom: 0; }
.only-phone { display: none !important; }
@media (max-width: 639px) {
  .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto; }
  .main { order: 1; }
  .side { order: 2; flex-direction: row; padding: 0 0 env(safe-area-inset-bottom); border-right: 0; border-top: 1px solid var(--line); }
  .brand, .cmdk, .sfoot { display: none; }
  .rail { flex: 1; min-width: 0; flex-direction: row; gap: 0; }
  .ni { flex: 1 1 0; min-width: 0; flex-direction: column; justify-content: center; gap: 2px; height: 52px; padding: 0 2px; border-radius: 0; background: transparent !important; font-size: 10.5px; line-height: 14px; text-align: center; }
  .ni .ic { width: 18px; height: 18px; }
  .ni .nnb { position: absolute; top: 3px; left: calc(50% + 4px); margin: 0; }
  .ustrip { gap: 4px; padding: 0 4px; font-size: 11px; }
  .ustrip .ulab, .ustrip .ubar { display: none; }
  .ustrip .uring, .ustrip .upct { display: inline-block; }
  .ni.on::before { content: ""; position: absolute; top: -1px; left: 25%; right: 25%; height: 2px; border-radius: 0 0 2px 2px; background: var(--accent); }
  .appbar { padding-left: 16px; }
  .only-phone { display: inline-grid !important; }
  .view { padding: 16px 12px 24px; }
  .view.fill { padding-bottom: 0; }
}

/* buttons */
.ib { display: inline-grid; place-items: center; flex: none; width: 28px; height: 28px; border: 0; border-radius: 6px; background: transparent; color: var(--fg-2); padding: 0; }
.ib:hover { background: var(--hover); color: var(--fg); }
.ib.pri { background: var(--fg); color: var(--bg); }
.ib.pri:hover { background: var(--fg); opacity: .85; }
.ib.err { color: var(--err); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 28px; padding: 0 12px; border: 1px solid var(--fg); border-radius: 6px; background: var(--fg); color: var(--bg); font-size: 13px; line-height: 20px; font-weight: 500; text-decoration: none; white-space: nowrap; max-width: 100%; }
.btn:hover { opacity: .85; }
.btn.tonal, .btn.outlined { background: var(--card); color: var(--fg); border-color: var(--line-2); }
.btn.tonal:hover, .btn.outlined:hover { background: var(--hover); opacity: 1; }
.btn.text { background: transparent; border-color: transparent; color: var(--fg-2); padding: 0 8px; }
.btn.text:hover { background: var(--hover); color: var(--fg); opacity: 1; }
.btn.danger { background: transparent; border-color: transparent; color: var(--err); padding: 0 8px; }
.btn.danger:hover { background: color-mix(in srgb, var(--err) 12%, transparent); opacity: 1; }
.btn.danger.fill { background: var(--err); border-color: var(--err); color: #fff; padding: 0 12px; }
.btns { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
@media (pointer: coarse) { .ib { width: 36px; height: 36px; } .btn { height: 36px; } .ni { min-height: 44px; } }

/* cards, lists, tags, bars */
.col { display: flex; flex-direction: column; gap: 12px; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 12px; }
.card { position: relative; min-width: 0; border: 1px solid var(--line); border-radius: 8px; background: var(--card); padding: 16px; }
.card.tap { cursor: pointer; transition: border-color .15s, background .15s; }
.card.tap:hover { border-color: var(--line-2); background: var(--hover); }
.card.tap:focus-visible { outline-offset: 0; }
.ch { display: flex; align-items: center; gap: 8px; min-height: 20px; margin-bottom: 12px; }
.ch h3 { flex: 1; min-width: 0; margin: 0; font: 500 13px/20px var(--font); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ch .chev { width: 14px; height: 14px; color: var(--fg-3); }
.card.tap:hover .chev { color: var(--fg); }
.big { font: 600 15px/22px var(--font); letter-spacing: -.01em; overflow-wrap: anywhere; }
.sup { color: var(--fg-2); font-size: 12px; line-height: 16px; overflow-wrap: anywhere; }
.err-t { color: var(--err); }
.muted { color: var(--fg-2); }
.empty { padding: 32px 16px; text-align: center; color: var(--fg-3); font-size: 12px; }
.dot { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--fg-3); }
.dot.ok { background: var(--ok); } .dot.warn { background: var(--warn); } .dot.err { background: var(--err); }
.dot.pri { background: var(--accent); animation: pulse 1.4s ease-in-out infinite; }
.dot.att { background: var(--warn); }
@keyframes pulse { 50% { opacity: .35; } }
.tag { display: inline-flex; align-items: center; flex: none; height: 20px; padding: 0 6px; border-radius: 4px; background: var(--layer); color: var(--fg-2); font-size: 11px; line-height: 16px; font-weight: 500; white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.tag.ok { background: color-mix(in srgb, var(--ok) 14%, transparent); color: var(--ok); }
.tag.warn { background: color-mix(in srgb, var(--warn) 14%, transparent); color: var(--warn); }
.tag.err { background: color-mix(in srgb, var(--err) 14%, transparent); color: var(--err); }
.tag.pri { background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent); }
.row { display: flex; align-items: center; gap: 8px; min-width: 0; }
.row + .row { margin-top: 8px; }
.row .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.kv { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
.kv .k { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.kv .v { flex: none; color: var(--fg-2); font-size: 12px; }
.bar { height: 4px; border-radius: 2px; background: var(--track); overflow: hidden; margin-top: 8px; }
.bar i { display: block; height: 100%; border-radius: 2px; background: var(--bar, var(--fg)); transition: width .3s; }
.bar.warn { --bar: var(--warn); } .bar.err { --bar: var(--err); }
.lim + .lim { margin-top: 12px; }
.more { margin-top: 12px; color: var(--fg-3); font-size: 12px; }
.sec { margin: 24px 0 8px; color: var(--fg-3); font: 500 12px/16px var(--font); }
.sec:first-child { margin-top: 0; }
.list { border: 1px solid var(--line); border-radius: 8px; background: var(--card); overflow: hidden; }
.list > * + * { border-top: 1px solid var(--line); }
.li { display: flex; align-items: center; gap: 12px; min-width: 0; min-height: 44px; padding: 8px 12px; color: inherit; text-align: left; width: 100%; border: 0; background: transparent; }
button.li:hover, .li.tap:hover { background: var(--hover); }
.li .lead { flex: none; display: inline-flex; color: var(--fg-3); }
.li .tx { flex: 1; min-width: 0; }
.li .hd { font-size: 13px; line-height: 20px; font-weight: 500; overflow-wrap: anywhere; }
.li.prow { flex-wrap: wrap; }
.li.prow .tx { flex: 1 1 140px; }
.avatar { flex: none; display: grid; place-items: center; width: 24px; height: 24px; border-radius: 6px; background: var(--layer); border: 1px solid var(--line); color: var(--fg-2); font: 600 11px/16px var(--font); text-transform: uppercase; }
.heads { display: flex; align-items: center; gap: 8px; min-width: 0; }
.heads .t { min-width: 0; font: 600 13px/20px var(--font); overflow-wrap: anywhere; }
.sp { flex: 1; }
.clamp { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.pickbox { display: flex; flex-direction: column; gap: 16px; max-height: min(46dvh, 340px); overflow-y: auto; margin: 0 -4px; padding: 0 4px; }
.kb:empty { display: none; }
.li.on { background: var(--active); }
.tools-bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
.tools-bar .sec { margin: 0; }
.sub { margin-top: 4px; }
.mt8 { margin-top: 8px; } .mt12 { margin-top: 12px; }

/* tabs */
.chips { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; padding: 0 0 12px; min-width: 0; flex: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { display: inline-flex; align-items: center; gap: 6px; flex: none; height: 28px; padding: 0 10px; border: 1px solid var(--line); border-radius: 6px; background: transparent; color: var(--fg-2); font-size: 13px; font-weight: 500; max-width: 100%; }
.chip:hover { background: var(--hover); color: var(--fg); }
.chip.on { background: var(--active); border-color: var(--line-2); color: var(--fg); }
.chip .tx { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* fields */
.tf { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.tf > label, .tf > .lb { font: 500 12px/16px var(--font); color: var(--fg-2); }
.fi, .sel { display: flex; align-items: center; gap: 8px; width: 100%; height: 32px; padding: 0 10px; border: 1px solid var(--line-2); border-radius: 6px; background: var(--card); outline: 0; font-size: 13px; text-align: left; }
.fi { min-width: 0; }
.fi::placeholder { color: var(--fg-3); }
.fi:focus, .sel[aria-expanded="true"] { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); }
.sel:hover { border-color: var(--fg-3); }
.sel .val { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sel svg.ic { color: var(--fg-3); width: 14px; height: 14px; }
@media (pointer: coarse) { .fi, .sel { height: 40px; font-size: 16px; } }
.lbl { margin: 16px 0 6px; font: 500 12px/16px var(--font); color: var(--fg-2); }

/* menu: the single dropdown component */
.menu { position: fixed; z-index: 1000; display: flex; flex-direction: column; padding: 4px; overflow-y: auto; border: 1px solid var(--line-2); border-radius: 8px; background: var(--pop); box-shadow: 0 8px 24px rgb(0 0 0 / .14); outline: 0; }
.menu .mh, .ph { z-index: 2; padding: 8px 8px 4px; color: var(--fg-3); font: 500 11px/16px var(--font); }
.menu .mh { position: sticky; top: -4px; background: var(--pop); }
.mi { display: flex; align-items: center; gap: 8px; width: 100%; min-height: 32px; padding: 4px 8px; border: 0; border-radius: 5px; background: transparent; text-align: left; font-size: 13px; line-height: 20px; }
.mi:hover, .mi:focus-visible { background: var(--hover); outline: 0; }
.mi .ck { flex: none; width: 14px; height: 14px; color: var(--accent); }
.mi .ml { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 8px; overflow-wrap: anywhere; }
.mi .ml small { flex: none; margin-left: auto; color: var(--fg-3); font-size: 11px; line-height: 16px; }
.mi.sel-on { font-weight: 500; }
@media (pointer: coarse) { .mi { min-height: 40px; font-size: 14px; } }

/* segmented control */
.seg { display: flex; flex-wrap: wrap; gap: 2px; padding: 2px; border-radius: 8px; background: var(--layer); }
.seg button { flex: 1 1 52px; min-width: 0; height: 26px; padding: 0 6px; border: 0; border-radius: 6px; background: transparent; color: var(--fg-2); font-size: 12px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.seg button:hover { color: var(--fg); }
.seg button.on { background: var(--card); color: var(--fg); box-shadow: 0 0 0 1px var(--line-2); }
@media (pointer: coarse) { .seg button { height: 34px; } }

/* dialog, palette, toast */
dialog.dlg, dialog.pal { margin: auto; border: 1px solid var(--line-2); border-radius: 12px; background: var(--pop); color: var(--fg); box-shadow: 0 16px 48px rgb(0 0 0 / .22); overflow: auto; }
dialog.dlg { width: min(420px, calc(100vw - 24px)); max-height: calc(100dvh - 24px); padding: 20px; }
dialog.dlg::backdrop, dialog.pal::backdrop { background: var(--scrim); }
.dtitle { margin: 0 0 16px; font: 600 14px/20px var(--font); letter-spacing: -.01em; overflow-wrap: anywhere; }
.dbody { display: flex; flex-direction: column; gap: 12px; color: var(--fg-2); }
.dbody p { margin: 0; overflow-wrap: anywhere; white-space: pre-line; }
.dact { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; margin-top: 20px; }
.dact:empty { display: none; }
dialog.pal { width: min(560px, calc(100vw - 24px)); margin: 12vh auto auto; padding: 0; max-height: min(480px, calc(100dvh - 24px)); }
.pal-head { display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 12px; border-bottom: 1px solid var(--line); color: var(--fg-3); }
.pal-in { flex: 1; min-width: 0; height: 100%; border: 0; outline: 0; background: transparent; color: var(--fg); font-size: 14px; }
@media (pointer: coarse) { .pal-in { font-size: 16px; } }
.pal-list { padding: 4px; overflow-y: auto; max-height: 360px; }
.pal-i { display: flex; align-items: center; gap: 8px; width: 100%; min-height: 32px; padding: 4px 8px; border: 0; border-radius: 6px; background: transparent; color: var(--fg); text-align: left; }
.pal-i.on { background: var(--hover); }
.pal-i .ic { color: var(--fg-3); }
.pal-i .nm { flex: none; max-width: 60%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pal-i .pd { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--fg-3); font-size: 12px; }
.pal-i.cmd .nm { font-family: var(--mono); font-size: 12px; }
.pal-out { margin: 0; padding: 12px; max-height: 360px; overflow: auto; font: 12px/18px var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; }
.pal-out.err { color: var(--err); }
.snack { position: fixed; z-index: 2000; left: 50%; bottom: 16px; transform: translateX(-50%); width: max-content; max-width: calc(100vw - 24px); padding: 8px 12px; border-radius: 8px; background: var(--fg); color: var(--bg); font-size: 13px; line-height: 20px; overflow-wrap: anywhere; }
.snack.bad { background: var(--err); color: #fff; }
@media (max-width: 639px) { .snack { bottom: calc(68px + env(safe-area-inset-bottom)); } }

/* target header: one switcher + 대화/터미널 toggle, shared by both views */
.thead { flex: none; display: flex; align-items: center; gap: 8px; min-width: 0; margin-bottom: 12px; }
.tsw { flex: 1; min-width: 0; display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
.tsw::-webkit-scrollbar { display: none; }

.pn .mt { flex: none; }
.sn { display: flex; align-items: flex-start; gap: 8px; min-width: 0; padding: 8px 12px; border-radius: 8px; background: var(--layer); font-size: 13px; line-height: 20px; }

.md p { margin: 0 0 6px; } .md p:last-child { margin-bottom: 0; }

details.work > summary { display: flex; align-items: center; gap: 8px; width: fit-content; max-width: 100%; min-height: 24px; margin-left: -4px; padding: 0 6px 0 4px; border-radius: 6px; color: var(--fg-3); font-size: 12.5px; line-height: 20px; cursor: pointer; list-style: none; }

.composer { flex: none; width: 100%; max-width: 720px; margin: 0 auto; padding: 0 0 max(16px, env(safe-area-inset-bottom)); }

.qitem .qt { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; white-space: pre-wrap; font-size: 13px; line-height: 18px; }
.qitem .qm { margin-top: 2px; color: var(--fg-3); font-size: 11px; line-height: 16px; }

.prompt { display: none; }

.composer.tmode .sendrow { padding: 6px 6px 6px 12px; border-radius: 10px; background: var(--tb); border-color: var(--tl2); color: var(--tf); font-family: var(--mono); }
.composer.tmode .prompt { display: block; flex: none; padding: 4px 0; color: var(--tac); font: 600 12.5px/20px var(--mono); }
.composer.tmode textarea { font: 12.5px/20px var(--mono); }

/* terminal: the same data as a terminal session */
.termbox { position: relative; flex: 1; min-height: 0; margin-bottom: 12px; }
.term { height: 100%; overflow-y: auto; overflow-x: hidden; padding: 12px 14px; border: 1px solid var(--tl2); border-radius: 10px; background: var(--tb); color: var(--tf); font: 12.5px/20px var(--mono); scrollbar-color: var(--tl2) transparent; }
.term .md p { margin: 0 0 8px; } .term .md p:last-child { margin: 0; }
.term .md code { background: rgb(255 255 255 / .09); }
.term .md pre { margin: 6px 0; padding: 8px 10px; border-radius: 6px; background: rgb(255 255 255 / .06); color: var(--tf); white-space: pre-wrap; overflow-wrap: anywhere; max-height: 300px; overflow: auto; }
.term .a-div, .term .tdv { color: var(--td); }
.tg { flex: none; width: 14px; color: var(--td); text-align: center; }
.tu, .th, .tt, .tk, .tr, .te { display: flex; gap: 8px; min-width: 0; }
.tu { margin: 14px -8px 6px; padding: 4px 8px; border-radius: 4px; background: rgb(255 255 255 / .07); }
.tu .tg { color: var(--tac); }
.tu .tx { min-width: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.tl { margin: 6px 0; border-radius: 4px; cursor: pointer; }
.tl:focus-visible, .tk:focus-visible { outline-offset: 3px; }
.tl.ok > .th > .tg { color: var(--tok); }
.tl.bad > .th > .tg { color: var(--terr); }
.th b { flex: none; font-weight: 600; }
.th .ti { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--td); }
.tl.open .th .ti { white-space: normal; overflow-wrap: anywhere; }
.tr { margin-left: 22px; color: var(--td); }
.tr .rt { min-width: 0; flex: 1; }
.tr .ln { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tr .more { opacity: .7; }
.tl.bad > .tr { color: var(--terr); }
.full { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 400px; overflow: auto; font: inherit; }
.targs { margin: 4px 0 0 22px; padding: 6px 8px; border-radius: 6px; background: rgb(255 255 255 / .06); color: var(--td); white-space: pre-wrap; overflow-wrap: anywhere; max-height: 240px; overflow: auto; font: inherit; }
.tl:not(.open) .full, .tl:not(.open) .targs { display: none; }
.tl.open .short { display: none; }
.tt { margin: 10px 0; }
.tt .md { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.tk { margin: 4px 0; color: var(--td); font-style: italic; cursor: pointer; }
.tk .tkt { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tk .tkf { display: none; min-width: 0; flex: 1; }
.tk.open .tkt { display: none; } .tk.open .tkf { display: block; }
.tdv { margin: 12px 0; font-size: 11.5px; line-height: 16px; text-align: center; overflow-wrap: anywhere; }
.te { margin: 6px 0; color: var(--terr); overflow-wrap: anywhere; }
.tc { margin: 6px 0; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--td); font: inherit; }
.tc.err { color: var(--terr); }
.jump { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); }
.a-div { margin: 8px 4px; font-size: 11px; line-height: 16px; color: var(--fg-3); text-align: center; overflow-wrap: anywhere; }
.a-text { padding: 6px 8px; overflow-wrap: anywhere; }
.a-time { margin-right: 8px; font-size: 11px; color: var(--fg-3); }
.a-error { margin: 4px; padding: 6px 8px; border-radius: 6px; background: color-mix(in srgb, var(--err) 12%, transparent); color: var(--err); overflow-wrap: anywhere; }
details.box { border-radius: 6px; }
details.box > summary { display: flex; align-items: center; gap: 8px; min-height: 28px; padding: 4px 8px; cursor: pointer; list-style: none; border-radius: 6px; font-size: 13px; line-height: 20px; }
details.box > summary:hover, details.box[open] > summary { background: var(--hover); }
details.box > summary::-webkit-details-marker { display: none; }
details.box > summary::before { content: ""; flex: none; width: 5px; height: 5px; border-right: 1.5px solid var(--fg-3); border-bottom: 1.5px solid var(--fg-3); transform: rotate(-45deg); transition: transform .15s; }
details.box[open] > summary::before { transform: rotate(45deg); }
.tname { flex: none; font: 500 12px/20px var(--mono); color: var(--fg); }
.tsum { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--fg-2); }
.tsum:empty { display: none; }
.ttime { flex: none; font-size: 11px; color: var(--fg-3); }
.tstate { flex: none; min-width: 10px; font-weight: 600; font-size: 12px; }
.tstate.ok { color: var(--ok); } .tstate.bad { color: var(--err); }
details.box .body { padding: 4px 8px 8px 21px; }
details.box .cl { margin: 8px 0 0; font: 500 11px/16px var(--font); color: var(--fg-3); }
details.box .cl:first-child { margin-top: 0; }
details.box .cl.err { color: var(--err); }
details.think > summary .tname { font-family: var(--font); color: var(--fg-2); }
details.think .md { padding: 4px 8px 8px 21px; color: var(--fg-2); font-size: 12px; }
.subline { display: flex; align-items: center; gap: 8px; margin-top: 12px; padding: 4px 8px; border-radius: 6px; background: color-mix(in srgb, var(--accent) 10%, transparent); color: var(--accent); font-size: 12px; line-height: 16px; cursor: pointer; }
.subs { flex: none; margin-bottom: 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); overflow: hidden; }
.subsum { display: flex; align-items: center; gap: 8px; width: 100%; min-height: 32px; padding: 4px 10px; border: 0; background: transparent; color: var(--fg-2); font-size: 12.5px; line-height: 20px; text-align: left; }
.subsum:hover { background: var(--hover); color: var(--fg); }
.subsum .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.subsum .chev { width: 14px; height: 14px; color: var(--fg-3); transition: transform .15s; }
.subsum[aria-expanded="true"] .chev { transform: rotate(180deg); }
.sublist { max-height: 196px; overflow-y: auto; padding: 4px; border-top: 1px solid var(--line); }
.subrow { display: flex; align-items: center; gap: 8px; width: 100%; min-height: 32px; padding: 0 8px; border: 0; border-radius: 6px; background: transparent; font-size: 13px; line-height: 20px; text-align: left; }
.subrow:hover { background: var(--hover); }
.subrow .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.sheet { position: fixed; z-index: 900; top: 0; right: 0; bottom: 0; display: flex; flex-direction: column; width: min(480px, 100vw); border-left: 1px solid var(--line-2); background: var(--bg); box-shadow: -8px 0 24px rgb(0 0 0 / .12); }
.sh-head { flex: none; display: flex; align-items: center; gap: 8px; height: calc(48px + env(safe-area-inset-top)); padding: env(safe-area-inset-top) 8px 0 16px; border-bottom: 1px solid var(--line); }
.sh-t { flex: 1; min-width: 0; }
.sh-name { font: 600 13px/20px var(--font); letter-spacing: -.01em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sh-t .sup { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sh-body { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; padding: 16px; }

.sh-body.term { height: auto; padding: 12px 14px; border: 0; border-radius: 0; }
@media (max-width: 639px) { .sheet { width: 100vw; border-left: 0; } .sh-body { padding: 12px; } }
.tl-in > .a-div { margin: 0; }

/* lanes board */
#v-lanes { max-width: none; }
.lboard { display: flex; flex-direction: column; gap: 12px; }
/* board: free-form 12-column card grid shared by 홈 and 레인 (positions are calc() of the container width, so no JS layout pass is needed) */
.bbar { display: flex; justify-content: flex-end; margin-bottom: 8px; }
.bbar .btn { height: 24px; font-size: 12px; }
.board { position: relative; }
.bi { position: absolute; border-radius: 8px; transition: left .18s ease, top .18s ease, width .18s ease, height .18s ease, box-shadow .15s; }
.bi > .card, .bi > .lpane { width: 100%; height: 100%; }
.bi > .card { overflow: hidden auto; }
.bi:hover, .bi.bdrag { box-shadow: var(--float); }
.bi.bdrag { z-index: 6; transition: box-shadow .15s; }
.bph { position: absolute; border: 1.5px dashed var(--accent); border-radius: 8px; background: color-mix(in srgb, var(--accent) 9%, transparent); transition: left .12s ease, top .12s ease, width .12s ease, height .12s ease; pointer-events: none; }
.boarding { user-select: none; -webkit-user-select: none; }
.board:not(.narrow) .bhead { cursor: grab; touch-action: none; }
.board:not(.narrow) .bi.bdrag .bhead { cursor: grabbing; }
.board .card { padding: 12px 14px; }
.board .ch { margin-bottom: 8px; }
.board .ch .ib { width: 24px; height: 24px; }
.brz { position: absolute; z-index: 3; touch-action: none; }
.brz.se { right: 0; bottom: 0; width: 14px; height: 14px; cursor: nwse-resize; }
.brz.se::after { content: ""; position: absolute; right: 3px; bottom: 3px; width: 7px; height: 7px; border-right: 2px solid var(--fg-3); border-bottom: 2px solid var(--fg-3); border-bottom-right-radius: 3px; opacity: .35; transition: opacity .15s; }
.bi:hover .brz.se::after, .bi.bdrag .brz.se::after, .brz.se:hover::after { opacity: .9; }
.brz.e { top: 14px; bottom: 16px; right: -3px; width: 8px; cursor: ew-resize; }
.brz.s { left: 14px; right: 16px; bottom: -3px; height: 8px; cursor: ns-resize; }
.board.narrow .brz { display: none; }
.board.narrow { display: flex; flex-direction: column; gap: 12px; }
.board.narrow .bi { position: relative; }
.board.narrow .bi > .card { height: auto; overflow: visible; }
.board.narrow .bhead { cursor: default; }
.card.att, .lpane.att { border-color: color-mix(in srgb, var(--warn) 55%, var(--line)); background: color-mix(in srgb, var(--warn) 8%, var(--card)); }
.card.att.err { border-color: color-mix(in srgb, var(--err) 55%, var(--line)); background: color-mix(in srgb, var(--err) 8%, var(--card)); }
.card.tap.att:hover { border-color: color-mix(in srgb, var(--warn) 75%, var(--line)); background: color-mix(in srgb, var(--warn) 14%, var(--card)); }
.card.tap.att.err:hover { border-color: color-mix(in srgb, var(--err) 75%, var(--line)); background: color-mix(in srgb, var(--err) 14%, var(--card)); }
.card.tap .lstat { color: var(--fg-2); }
.card .subline { margin-top: 6px; }
.card .clamp { margin-top: 6px; }
/* bundle card: one row per item, each row opens the item and has its own ⋯ */
.glist { display: flex; flex-direction: column; gap: 2px; }
.grow { display: flex; align-items: center; gap: 6px; min-width: 0; margin: 0 -6px; padding: 4px 4px 4px 6px; border-radius: 6px; cursor: pointer; }
.grow:hover { background: var(--hover); }
.grow .gm { flex: 1; min-width: 0; }
.grow .gm .bar { margin-top: 6px; }
.grow > .ib { flex: none; width: 24px; height: 24px; opacity: 0; }
.grow:hover > .ib, .grow:focus-within > .ib, .grow > .ib[aria-expanded="true"] { opacity: 1; }
@media (hover: none) { .grow > .ib { opacity: 1; } }
.grow.att { background: color-mix(in srgb, var(--warn) 12%, transparent); }
.grow.att.err { background: color-mix(in srgb, var(--err) 12%, transparent); }
@media (pointer: coarse) { .brz.e, .brz.s { display: none; } .brz.se { width: 24px; height: 24px; } .brz.se::after { right: 6px; bottom: 6px; } .board:not(.narrow) .bi > .lpane .lcomp { padding: 8px 24px 24px 8px; } }
.lpane { display: flex; flex-direction: column; min-width: 0; height: 360px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); overflow: hidden; }
.lpane.off .lname { color: var(--fg-2); }
.lhead { flex: none; display: flex; flex-direction: column; gap: 2px; padding: 10px 12px 6px; border-bottom: 1px solid var(--line); }
.ltop { display: flex; align-items: center; gap: 8px; min-width: 0; }

// Layered layout: flow nodes sit in the column of their longest path from an input; file and support nodes join the
// column of the node they attach to (above and below it); one flow node per column is centered on the middle line.
function hLayout(avail) {
  const nodes = HG.nodes, byId = new Map(nodes.map(n => [n.id, n]));
  const flow = nodes.filter(n => n.group === "flow");
  const col = new Map(flow.map(n => [n.id, 0]));
  for (let i = 0; i < flow.length; i++) for (const e of HG.edges) if (col.has(e.from) && col.has(e.to)) col.set(e.to, Math.max(col.get(e.to), col.get(e.from) + 1));
  const colOf = n => { let x = n; for (let i = 0; i < 6 && x.group !== "flow"; i++) x = byId.get(x.anchor) || x; return col.get(x.id) || 0; };
  const key = n => { const a = byId.get(n.anchor); return a && a.group !== "flow" ? key(a) + 0.5 : n.order || 0; };
  const ncol = Math.max(...flow.map(n => col.get(n.id))) + 1;
  const cols = Array.from({ length: ncol }, () => ({ flow: [], att: [] }));
  for (const n of flow) cols[col.get(n.id)].flow.push(n);
  for (const n of nodes) if (n.group !== "flow") cols[colOf(n)].att.push(n);
  const GX = 56, HF = hFeat && !H_MQ.matches && FC ? 90 : 72, HA = hFeat && !H_MQ.matches && FC ? 78 : 60, VG = 10, HEAD = 26;
  const CW = Math.max(150, Math.min(200, Math.floor((avail - GX * (ncol - 1)) / ncol)));
  for (const c of cols) {
    c.att.sort((a, b) => key(a) - key(b));
    const up = c.flow.length === 1 ? Math.ceil(c.att.length / 2) : 0;
    c.above = c.att.slice(0, up); c.below = c.att.slice(up);
    c.aboveH = c.above.length * (HA + VG);
    c.blockH = c.flow.length * HF + (c.flow.length - 1) * VG;
  }
  const mid = Math.max(...cols.map(c => c.aboveH + c.blockH / 2));
  const rects = {};
  let bottom = 0;
  cols.forEach((c, i) => {
    let y = HEAD + mid - c.blockH / 2 - c.aboveH;
    const x = i * (CW + GX);
    for (const [list, h] of [[c.above, HA], [c.flow, HF], [c.below, HA]]) for (const n of list) { rects[n.id] = { x, y, w: CW, h, col: i }; y += h + VG; }
    bottom = Math.max(bottom, y - VG);
  });
  return { rects, cols, width: ncol * CW + (ncol - 1) * GX, height: bottom + 8, CW, GX };
}

// Edge paths: curves between columns (right side -> left side). Inside one column the helpers feed their flow node over
// a shared bus in the gutter (one line, one arrowhead); two stacked helpers are joined by a short straight arrow.
// Several curves on one side of a card are spread a few px apart so their arrowheads stay readable.
function hRoutes(L) {
  const rows = HG.edges.filter(e => L.rects[e.from] && L.rects[e.to]).map(e => {
    const a = L.rects[e.from], b = L.rects[e.to], same = a.col === b.col;
    return { e, a, b, same, sa: same || a.col < b.col ? "r" : "l", sb: same ? "r" : a.col < b.col ? "l" : "r" };
  });
  const ports = new Map();
  const add = (id, side, r, other, k) => { const key = id + side; if (!ports.has(key)) ports.set(key, []); ports.get(key).push({ r, k, y: other.y + other.h / 2 }); };
  for (const r of rows) if (!r.same) { add(r.e.from, r.sa, r, r.b, "oa"); add(r.e.to, r.sb, r, r.a, "ob"); }
  for (const list of ports.values()) { list.sort((p, q) => p.y - q.y); list.forEach((p, i) => { p.r[p.k] = Math.max(-26, Math.min(26, (i - (list.length - 1) / 2) * 8)); }); }
  for (const r of rows) {
    const y1 = r.a.y + r.a.h / 2 + (r.oa || 0), y2 = r.b.y + r.b.h / 2 + (r.ob || 0);
    if (r.same) {
      const gap = r.b.y > r.a.y ? r.b.y - (r.a.y + r.a.h) : r.a.y - (r.b.y + r.b.h);
      const cx = r.a.x + r.a.w / 2;
      if (hNode(r.e.to).group !== "flow" && gap <= 14) {
        const down = r.b.y > r.a.y;
        r.d = `M${cx} ${down ? r.a.y + r.a.h : r.a.y}V${down ? r.b.y : r.b.y + r.b.h}`; r.lx = cx; r.ly = (r.a.y + r.b.y + r.b.h) / 2;
      } else {
        const x1 = r.a.x + r.a.w, gx = x1 + 10;
        r.d = `M${x1} ${y1}H${gx}V${y2}H${x1}`; r.lx = gx; r.ly = (y1 + y2) / 2;
      }
    } else {
      const x1 = r.sa === "r" ? r.a.x + r.a.w : r.a.x, x2 = r.sb === "l" ? r.b.x : r.b.x + r.b.w;
      const dx = Math.max(24, Math.abs(x2 - x1) * 0.5) * (x2 > x1 ? 1 : -1);
      r.d = `M${x1} ${y1}C${x1 + dx} ${y1} ${x2 - dx} ${y2} ${x2} ${y2}`; r.lx = (x1 + x2) / 2; r.ly = (y1 + y2) / 2;
    }
  }
  return rows;
}

function hCanvas(avail) {
  const L = hLayout(avail || 1000);
  const canvas = el("div", { class: "hm-canvas", style: `width:${L.width}px;height:${L.height}px` });
  const svg = hSvg("svg", { class: "hm-svg", width: L.width, height: L.height, viewBox: `0 0 ${L.width} ${L.height}` });
  const defs = hSvg("defs");
  for (const [id, cls] of [["hm-ah", "hm-ah"], ["hm-ah-hot", "hm-ah hot"]]) {
    const m = hSvg("marker", { id, viewBox: "0 0 8 8", refX: "7", refY: "4", markerWidth: "7", markerHeight: "7", orient: "auto" });
    m.append(hSvg("path", { d: "M0 0L8 4L0 8z", class: cls })); defs.append(m);
  }
  svg.append(defs);
  const labels = hSvg("g");
  for (const r of hRoutes(L)) {
    const sup = hNode(r.e.from).group !== "flow" || hNode(r.e.to).group !== "flow";
    const path = hSvg("path", { d: r.d, class: `hm-edge${sup ? " sup" : ""}`, "marker-end": "url(#hm-ah)" });
    const tip = hSvg("title");
    tip.textContent = `${hNode(r.e.from).label} → ${hNode(r.e.to).label}: ${r.e.label}`;
    path.append(tip);
    const label = hSvg("text", { x: r.lx, y: r.ly + 3.5, class: "hm-lb", "text-anchor": "middle" });
    label.textContent = r.e.label;
    svg.append(path); labels.append(label);
    hEdgeRefs.push({ e: r.e, path, label });
  }
  svg.append(labels);
  canvas.append(svg);
  L.cols.forEach((c, i) => canvas.append(el("div", { class: "hm-ch", style: `left:${i * (L.CW + L.GX)}px;width:${L.CW}px`, text: H_COLS[i] || "" })));
  for (const n of HG.nodes) { const r = L.rects[n.id]; const b = hCard(n, false); b.style.cssText = `left:${r.x}px;top:${r.y}px;width:${r.w}px;height:${r.h}px`; canvas.append(b); }
  return el("div", { class: "hm-scroll" }, canvas);
}

// Phone: the same nodes as a vertical flow, one step per column, with the edge labels as the arrows between steps.

    } else if (s.type === "select" || s.type === "effort" || s.type === "model") {
      const opts = s.type === "model" ? null : s.options || [];
      const text = s.type === "model" ? modelName(draft) : ((opts.find(o => o.value === draft) || {}).label ?? String(draft));
      const b = el("button", { type: "button", class: "sel", "aria-haspopup": "listbox", "aria-expanded": "false", "aria-label": `${s.label}: ${text}` }, el("span", { class: "val", text }), icon("drop"));
      b.addEventListener("click", () => showMenu(b, opts || hModelItems(draft), { value: draft, onPick: v => { draft = v; paint(); } }));
      ctl.append(b);
    } else if (s.type === "number") {
      const inp = el("input", { class: "fi", type: "number", inputmode: "numeric", min: s.min, max: s.max, value: Number.isNaN(draft) ? "" : String(draft), "aria-label": s.label });
      inp.addEventListener("input", () => { draft = inp.value.trim() === "" ? NaN : Number(inp.value); mark(); });
      ctl.append(inp, s.unit ? el("span", { class: "unit", text: s.unit }) : null);
    } else if (s.multiline) {
      const ta = el("textarea", { class: "fi hs-ta", rows: 4, spellcheck: "false", "aria-label": s.label }); ta.value = String(draft);
      ta.addEventListener("input", () => { draft = ta.value; mark(); });
      ctl.append(ta);
    } else {
      const inp = el("input", { class: "fi", type: "text", autocomplete: "off", autocapitalize: "off", spellcheck: "false", value: String(draft), "aria-label": s.label });
      inp.addEventListener("input", () => { draft = inp.value; mark(); });
      ctl.append(inp);
    }
    mark();
  };
  reset.onclick = () => { draft = s.default; paint(); };
  save.onclick = () => {
    note.className = "note";
    return busy(save, async () => {
      try {
        const r = await api("/api/harness/config", "PATCH", { path: s.key, value: draft });
        cur = draft = r.value === undefined ? draft : r.value;
        const [t, tone] = H_APPLY[r.applies] || ["", ""];
        tag.className = `tag ${tone}`; tag.textContent = t;
        note.className = "note ok"; note.textContent = r.note;
        toast(`${s.label}: ${r.note}`);
        paint(); loadHarness(true);
      } catch (e) { note.className = "note err"; note.textContent = e.message; throw e; }
    });
  };
  drafts.push(dirty);
  box.append(el("div", { class: "top" }, el("span", { class: "lb", text: s.label }), tag), ctl, el("div", { class: "btns hs-act" }, reset, save), note);
  paint();
  return box;
}

// Prompt-file editor: loads the file, saves atomically (the server keeps the previous text as <name>.bak).
function hFileEditor(n, drafts, line) {
  const ta = el("textarea", { class: "fi hs-ta hs-mono", rows: 18, spellcheck: "false", "aria-label": n.file });
  ta.readOnly = !n.fileEditable;
  const info = el("div", { class: "note" }), warn = el("div", { class: "note err", style: "white-space:pre-line" });
  const save = el("button", { class: "btn", type: "button", disabled: true }, "저장");
  const undo = el("button", { class: "btn text", type: "button", disabled: true }, "되돌리기");
  let orig = "";
  const dirty = () => ta.value !== orig;
  const mark = () => { save.disabled = !n.fileEditable || !dirty(); undo.disabled = !dirty(); };
  const url = `/api/harness/file/${n.file.split("/").map(enc).join("/")}`;
  ta.addEventListener("input", mark);
  ta.addEventListener("keydown", ev => { if ((ev.metaKey || ev.ctrlKey) && ev.key.toLowerCase() === "s") { ev.preventDefault(); if (!save.disabled) save.click(); } });
  undo.onclick = () => { ta.value = orig; mark(); };
  save.onclick = () => busy(save, async () => {
    const r = await api(url, "PUT", { text: ta.value });
    orig = ta.value; warn.textContent = (r.warnings || []).join("\n");
    info.className = "note ok";
    info.textContent = r.unchanged ? r.note : `저장했어요${r.backup ? ` · 이전 내용은 ${r.backup} 로 보관` : ""} · ${r.note}`;
    mark(); loadHarness(true);
  });
  drafts.push(dirty);
  // Puts the caret on a 1-based line and scrolls the editor there (a hidden copy of the text measures wrapped lines).
  const gotoLine = ln => {
    const lines = ta.value.split("\n"), start = lines.slice(0, ln - 1).reduce((s, l) => s + l.length + 1, 0), end = start + (lines[ln - 1] || "").length;
    const cs = getComputedStyle(ta);
    const mir = el("div", { style: `position:absolute;visibility:hidden;left:-9999px;top:0;box-sizing:border-box;width:${ta.clientWidth}px;padding:${cs.padding};font-family:${cs.fontFamily};font-size:${cs.fontSize};line-height:${cs.lineHeight};white-space:pre-wrap;overflow-wrap:break-word` });
    const at = el("span", { text: "\u200b" });
    mir.append(ta.value.slice(0, start), at); document.body.append(mir);
    const top = at.offsetTop; mir.remove();
    ta.closest(".hs-fw").scrollIntoView({ block: "start" });
    ta.focus({ preventScroll: true }); ta.setSelectionRange(start, end);
    ta.scrollTop = Math.max(0, top - 60);
  };
  hGoto = gotoLine;
  api(url).then(r => {
    orig = r.text; ta.value = r.text;
    info.textContent = `${num(r.text.length)}자${r.cap ? ` (시작 프롬프트에는 앞 ${num(r.cap)}자까지)` : ""} · ${r.modified ? `${kstStamp(r.modified)} 수정` : "아직 없는 파일 (저장하면 만들어져요)"} · ${r.note}`;
    mark();
    if (line) gotoLine(line);
  }, e => { info.className = "note err"; info.textContent = e.message; });
  return el("div", { class: "hs-fw" }, ta, el("div", { class: "btns hs-act" }, n.fileEditable ? undo : null, n.fileEditable ? save : null), info, warn);
}

/* ---------- 구성: 기능 보기 (what the owner added, by implementation form; data from /api/features) ---------- */
const FC_NOTE = {
  "글 지시": "프롬프트에 들어가는 글이에요. 모델이 따르도록 부탁하는 것이라 어길 수도 있어요 (권고).",
  "차단 명령": "RULES 의 deny 줄이에요. 실행 직전에 코드가 막아요 (강제).",
  "스킬": "SKILL.md 절차서예요. 모델이 필요할 때 읽고 따라요 (권고).",
  "omp 확장": "omp 에 설치된 코드예요. 훅으로 호출·도구 실행을 막거나 고쳐요 (강제).",
  "예약": "정해진 시각에 문장을 오케스트레이터에게 보내는 타이머예요.",
  "감시": "모델을 깨우지 않고 주기적으로 명령을 돌려 변화만 알리는 점검이에요.",
  "작업 채널 설정": "작업 채널마다 묶어 둔 로그인 유지와 감시예요.",
  "게이트웨이 기능": "게이트웨이 코드에 들어 있는 기능이에요.",
  "외부 연동": "Discord·메일(zele)·브라우저(Aside) 같은 바깥 서비스와의 연결이에요.",
};
const FC_STR = { enforced: "강제", advisory: "권고" };
const FC_FILE_NODE = { "RULES.md": "rules", "LESSONS.md": "lessons", "identity/IDENTITY.md": "identity" };
const fcOf = id => (FC ? FC.features.filter(f => f.stage === id) : []);
const fcDupText = f => (f.dup && f.dup.length ? `같은 일을 ${f.strength === "advisory" ? "코드(강제)" : "글(권고)"}로도 적어 뒀어요: ${f.dup.map(d => d.name).join(", ")}` : "");

function fcBadges(id) {
  if (!hFeat || !FC || H_MQ.matches) return null;
  const list = fcOf(id), e = list.filter(f => f.strength === "enforced").length, a = list.length - e;
  if (!list.length) return null;
  return el("span", { class: "hm-bd", title: `여기서 작동하는 기능: 강제 ${e}개 · 권고 ${a}개` }, e ? el("span", { class: "bd f", text: `강제 ${e}` }) : null, a ? el("span", { class: "bd a", text: `권고 ${a}` }) : null);
}

function fcSwitch(f) {
  const sw = el("button", { type: "button", class: "hs-sw", role: "switch", "aria-checked": String(f.enabled), "aria-label": `${f.name} ${f.enabled ? "끄기" : "켜기"}`, title: f.enabled ? "끄기" : "켜기" });
  sw.addEventListener("click", ev => {
    ev.stopPropagation();
    busy(sw, async () => { const r = await api(`/api/features/${enc(f.id)}/toggle`, "POST", { enabled: !f.enabled }); toast(`${f.name}: ${r.note}`); await loadHarness(true); });
  });
  return sw;
}

// A card opens the harness node it works in; text rules open their file editor at the line.
function fcOpenFeature(f) {
  const node = FC_FILE_NODE[f.source.file];
  if (node && f.source.line) openHSheet(node, { line: f.source.line, feature: f.id });
  else openHSheet(f.stage, { feature: f.id });
}

function fcCard(f) {
  const node = hNode(f.stage), dup = fcDupText(f);
  const c = el("div", { class: `fc-card ${f.strength}${f.enabled ? "" : " off"}`, tabindex: "0", role: "button", "aria-label": `${f.name}: ${f.what}` },
    el("div", { class: "top" }, el("span", { class: "nm", text: f.name }), f.toggleable ? fcSwitch(f) : null),
    f.what ? el("div", { class: "wh", text: f.what }) : null,
    el("div", { class: "fc-tags" },
      el("span", { class: `tag st ${f.strength}`, title: f.strength === "enforced" ? "코드·훅·차단 줄이 막거나 실행해요" : "모델에게 따르라고 부탁한 글이에요", text: FC_STR[f.strength] }),
      el("span", { class: "tag", text: f.trigger }),
      node ? el("span", { class: "tag", text: node.label.replace(/\s*\(.*\)$/, "") }) : null,
      !f.enabled ? el("span", { class: "tag", text: "꺼짐" }) : null,
      dup ? el("span", { class: "tag warn", title: dup, text: "중복" }) : null),
    dup ? el("div", { class: "dup", text: dup }) : null,
    el("div", { class: "src", text: [f.source.label, f.added ? `${f.added} 추가` : "", f.lastRun ? `마지막 ${kstStamp(f.lastRun)}` : ""].filter(Boolean).join(" · ") }));
  c.addEventListener("click", () => fcOpenFeature(f));
  c.addEventListener("keydown", ev => { if ((ev.key === "Enter" || ev.key === " ") && ev.target === c) { ev.preventDefault(); fcOpenFeature(f); } });
  return c;
}

const fcMatch = f => {
  const q = fcFilter.q.trim().toLowerCase();
  return (!fcFilter.form || f.form === fcFilter.form) && (!fcFilter.strength || f.strength === fcFilter.strength) && (!fcFilter.trigger || f.trigger === fcFilter.trigger)
    && (!q || `${f.name} ${f.what} ${f.source.label} ${f.trigger} ${f.form} ${f.extra || ""}`.toLowerCase().includes(q));
};

function fcPaintList() {
  const all = FC.features, hit = all.filter(fcMatch), filtering = !!(fcFilter.q.trim() || fcFilter.form || fcFilter.strength || fcFilter.trigger);
  const e = hit.filter(f => f.strength === "enforced").length;
  fcCount.textContent = `${filtering ? `${hit.length} / ${all.length}개` : `${all.length}개`} · 강제 ${e} · 권고 ${hit.length - e}`;
  clear(fcList);
  if (!hit.length) { fcList.append(emptyNode("조건에 맞는 기능이 없어요")); return; }
  for (const form of FC.forms) {
    const items = hit.filter(f => f.form === form);
    if (!items.length) continue;
    const fe = items.filter(f => f.strength === "enforced").length, shut = !filtering && fcCollapsed.has(form);
    const head = el("button", { type: "button", class: "fc-gh", "aria-expanded": String(!shut) }, icon("drop"), el("span", { text: form }), el("span", { class: "tag", text: `${items.length}개` }),
      el("span", { class: "sup", text: `강제 ${fe} · 권고 ${items.length - fe}` }), el("div", { class: "note", text: FC_NOTE[form] || "" }));
    head.addEventListener("click", () => { if (filtering) return; if (fcCollapsed.has(form)) fcCollapsed.delete(form); else fcCollapsed.add(form); fcPaintList(); });
    fcList.append(head);
    if (!shut) fcList.append(el("div", { class: "fc-grid" }, ...items.map(fcCard)));
  }
}

// The 기능 목록 shell (search + filters) is built once so typing is not interrupted by the 15 s refresh; only the list repaints.
function fcBuild(box) {
  const q = el("input", { class: "fi", type: "text", autocomplete: "off", spellcheck: "false", placeholder: "기능 검색 (이름·내용·파일)", "aria-label": "기능 검색", value: fcFilter.q });
  q.addEventListener("input", () => { fcFilter.q = q.value; fcPaintList(); });
  const pick = (key, label, options) => {
    const val = el("span", { class: "val" });
    const b = el("button", { type: "button", class: "sel", "aria-haspopup": "listbox", "aria-expanded": "false" }, val, icon("drop"));
    const paint = () => { val.textContent = `${label}: ${fcFilter[key] || "전체"}`; b.setAttribute("aria-label", val.textContent); };
    b.addEventListener("click", () => showMenu(b, [{ value: "", label: "전체" }, ...options().map(v => ({ value: v, label: v }))], { value: fcFilter[key], onPick: v => { fcFilter[key] = v; paint(); fcPaintList(); } }));
    paint();
    return b;
  };
  const seg = el("div", { class: "seg", role: "group", "aria-label": "강제/권고" });
  for (const [v, t] of [["", "전체"], ["enforced", "강제"], ["advisory", "권고"]]) {
    const b = el("button", { type: "button", class: fcFilter.strength === v ? "on" : "", text: t });
    b.addEventListener("click", () => { fcFilter.strength = v; for (const x of seg.children) x.classList.toggle("on", x === b); fcPaintList(); });
    seg.append(b);
  }
  fcCount = el("div", { class: "sup fc-count" });
  fcList = el("div");
  box.append(el("div", { class: "sec", text: "기능 목록" }),
    el("div", { class: "sup", text: "내가 더한 기능을 구현 형식별로 모았어요. 실선·강제는 코드가 막거나 실행하는 것, 점선·권고는 모델에게 따르라고 부탁한 글이에요. 카드를 누르면 작동하는 자리와 파일이 열려요." }),
    el("div", { class: "fc-bar" }, q, pick("form", "형식", () => FC.forms), pick("trigger", "트리거", () => FC.triggers), seg), fcCount, fcList);
}

function renderFeatures() {
  const box = hFcBox;
  if (!box) return;
  if (!FC) { clear(box); fcSig = ""; return; }
  const sig = JSON.stringify(FC.features) + (HG ? HG.nodes.map(n => n.label).join("") : "");
  if (sig === fcSig && box.firstChild) return;
  fcSig = sig;
  if (!box.firstChild) fcBuild(box);
  fcPaintList();
}

// 상세 시트: the features that work at this node, enforced first.
function fcSheetSection(n, focusId) {
  const list = fcOf(n.id).sort((a, b) => (a.strength === b.strength ? 0 : a.strength === "enforced" ? -1 : 1));
  if (!list.length) return [];
  const e = list.filter(f => f.strength === "enforced").length;
  const rows = list.map(f => {
    const dup = fcDupText(f), jump = !!(n.file && f.source.file && f.source.line);
    const r = el("div", { class: `hs-ft ${f.strength}${jump ? " go" : ""}${f.id === focusId ? " on" : ""}`, "data-fid": f.id },
      el("div", { class: "top" }, el("span", { class: `tag st ${f.strength}`, text: FC_STR[f.strength] }), el("span", { class: "nm", text: f.name }), f.toggleable ? fcSwitch(f) : null),
      f.what ? el("div", { class: "wh", text: f.what }) : null,
      el("div", { class: "src", text: `${f.trigger} · ${f.source.label}` }),
      dup ? el("div", { class: "dup", text: dup }) : null);
    if (jump) r.addEventListener("click", () => hGoto && hGoto(f.source.line));
    return r;
  });
  return [el("div", { class: "sec", text: `여기서 작동하는 기능 · 강제 ${e} · 권고 ${list.length - e}` }), el("div", { class: "hs-fts" }, ...rows)];
}

$("#hs-close").append(icon("close"));
$("#hs-close").onclick = closeHSheet;
document.addEventListener("keydown", ev => { if (ev.key === "Escape" && !$("#hsheet").hidden && !openMenu && !document.querySelector("dialog[open]")) closeHSheet(); });
H_MQ.addEventListener("change", () => { if (current === "harness") renderHarness(); });
let hW = 0;
window.addEventListener("resize", () => { if (current !== "harness" || H_MQ.matches) return; clearTimeout(hTimer); hTimer = setTimeout(() => { const w = $("#harness").clientWidth; if (Math.abs(w - hW) > 40) { hW = w; renderHarness(); } }, 150); });
setInterval(() => { if (current === "harness" && !document.hidden && !hLoading) loadHarness(true); }, 15000);

/* ---------- boot ---------- */
(async () => {
  const h = parseHash();
  go(h.view || "home", h.t);
  await refreshState();
  loadTarget(target);
  loadModels(true);
  loadProviderData().then(() => { if (current === "home") renderHome(); }, () => {});
  loadSubs(); loadQueue(); loadContext(true).then(renderCtxRing);
  let opened = false;
  const es = new EventSource("/api/events");
  es.onopen = () => {
    setConn(true);
    if (opened) { refreshState(); for (const k of Object.keys(TS)) TS[k].hLoaded = TS[k].aLoaded = false; renderAll(); loadTarget(target); loadSubs(); loadQueue(); laneTailsStale(); }
    opened = true;
  };
  es.onerror = () => setConn(false);
  es.onmessage = m => {
    let e;
    try { e = JSON.parse(m.data); } catch { return; }
    if (e.kind === "activity") { onActivity(e); laneActivity(e); }
    else if (e.kind === "subagents") setSubs(e.source, e.items);
    else if (e.kind === "queue") { QUEUE = e.items || []; renderQueue(); }
    else { ingestMsg(e); scheduleState(); }
  };
  setInterval(refreshState, 15000);
  $("#ustrip").onclick = () => go("usage");
  loadStrip(); setInterval(loadStrip, 60000);
  document.addEventListener("visibilitychange", () => { markSeen(); attnChanged(); loadStrip(); });
  setInterval(() => loadModels(true), 60000);
})();
</script>
