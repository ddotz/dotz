<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#FEF7FF">
<title>dotz</title>
<script>
// Theme is applied before first paint: explicit choice (light/dark) or the system setting.
(() => {
  const mq = matchMedia("(prefers-color-scheme: dark)");
  const get = () => { const v = localStorage.getItem("dotz-theme"); return v === "light" || v === "dark" ? v : "system"; };
  const apply = () => {
    const p = get(), dark = p === "dark" || (p === "system" && mq.matches);
    document.documentElement.dataset.theme = dark ? "dark" : "light";
    const m = document.querySelector('meta[name="theme-color"]');
    if (m) m.content = dark ? "#141218" : "#FEF7FF";
  };
  mq.addEventListener("change", apply);
  window.dotzTheme = { get, set: v => { if (v === "system") localStorage.removeItem("dotz-theme"); else localStorage.setItem("dotz-theme", v); apply(); } };
  apply();
})();
</script>
<style>
/* Material 3 baseline tonal palette, light + dark color roles */
:root {
  color-scheme: light;
  --primary: #6750A4; --on-primary: #FFFFFF; --primary-container: #EADDFF; --on-primary-container: #21005D;
  --secondary: #625B71; --secondary-container: #E8DEF8; --on-secondary-container: #1D192B;
  --error: #B3261E; --on-error: #FFFFFF; --error-container: #F9DEDC; --on-error-container: #410E0B;
  --ok: #1B6D2F; --ok-container: #CBEFCE; --on-ok-container: #002108;
  --warn: #8A5100; --warn-container: #FFDCBD; --on-warn-container: #2C1600;
  --surface: #FEF7FF; --on-surface: #1D1B20; --on-surface-variant: #49454F;
  --surface-container-lowest: #FFFFFF; --surface-container-low: #F7F2FA; --surface-container: #F3EDF7;
  --surface-container-high: #ECE6F0; --surface-container-highest: #E6E0E9;
  --outline: #79747E; --outline-variant: #CAC4D0;
  --inverse-surface: #322F35; --inverse-on-surface: #F5EFF7;
  --scrim: rgb(0 0 0 / .32);
  --font: "Roboto Flex", "Roboto", system-ui, -apple-system, "Noto Sans KR", "Apple SD Gothic Neo", "Segoe UI", sans-serif;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --primary: #D0BCFF; --on-primary: #381E72; --primary-container: #4F378B; --on-primary-container: #EADDFF;
  --secondary: #CCC2DC; --secondary-container: #4A4458; --on-secondary-container: #E8DEF8;
  --error: #F2B8B5; --on-error: #601410; --error-container: #8C1D18; --on-error-container: #F9DEDC;
  --ok: #8DD79A; --ok-container: #00531F; --on-ok-container: #CBEFCE;
  --warn: #FFB86C; --warn-container: #693C00; --on-warn-container: #FFDCBD;
  --surface: #141218; --on-surface: #E6E0E9; --on-surface-variant: #CAC4D0;
  --surface-container-lowest: #0F0D13; --surface-container-low: #1D1B20; --surface-container: #211F26;
  --surface-container-high: #2B2930; --surface-container-highest: #36343B;
  --outline: #938F99; --outline-variant: #49454F;
  --inverse-surface: #E6E0E9; --inverse-on-surface: #322F35;
  --scrim: rgb(0 0 0 / .5);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { font: 400 14px/20px var(--font); letter-spacing: .015em; background: var(--surface); color: var(--on-surface); overflow: hidden; -webkit-text-size-adjust: 100%; }
button, input, textarea { font: inherit; color: inherit; letter-spacing: inherit; }
button { cursor: pointer; }
code, pre { font-family: var(--mono); }
:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
svg.ic { width: 24px; height: 24px; fill: currentColor; flex: none; }
.sm svg.ic, svg.ic.sm { width: 18px; height: 18px; }

/* state layer: hover / focus / press on every interactive surface */
.btn, .ib, .chip, .tap, .mi, .seg button, .ni .ind, .sel, .hintchip { position: relative; overflow: hidden; }
.btn::before, .ib::before, .chip::before, .tap::before, .mi::before, .seg button::before, .ni .ind::before, .sel::before, .hintchip::before { content: ""; position: absolute; inset: 0; background: currentColor; opacity: 0; transition: opacity .15s; pointer-events: none; border-radius: inherit; }
.btn:hover::before, .ib:hover::before, .chip:hover::before, .tap:hover::before, .mi:hover::before, .seg button:hover::before, .ni:hover .ind::before, .sel:hover::before, .hintchip:hover::before { opacity: .08; }
.btn:focus-visible::before, .ib:focus-visible::before, .chip:focus-visible::before, .tap:focus-visible::before, .mi:focus-visible::before, .seg button:focus-visible::before, .ni:focus-visible .ind::before, .sel:focus-visible::before, .hintchip:focus-visible::before,
.btn:active::before, .ib:active::before, .chip:active::before, .tap:active::before, .mi:active::before, .seg button:active::before, .ni:active .ind::before, .sel:active::before, .hintchip:active::before { opacity: .12; }
button:disabled { opacity: .38; cursor: default; pointer-events: none; }

/* layout: navigation bar (phone) / rail (wide) */
.app { display: grid; grid-template-columns: 80px minmax(0, 1fr); height: 100vh; height: 100dvh; }
.rail { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 44px 0 12px; background: var(--surface); }
.ni { display: flex; flex-direction: column; align-items: center; gap: 4px; width: 80px; border: 0; background: transparent; padding: 0; color: var(--on-surface-variant); font-size: 12px; line-height: 16px; font-weight: 500; }
.ni .ind { display: grid; place-items: center; width: 56px; height: 32px; border-radius: 16px; transition: background .2s; }
.ni.on { color: var(--on-surface); }
.ni.on .ind { background: var(--secondary-container); color: var(--on-secondary-container); }
.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.appbar { flex: none; display: flex; align-items: center; gap: 4px; min-height: 64px; padding: max(8px, env(safe-area-inset-top)) 8px 8px 16px; background: var(--surface); transition: background .2s; }
.appbar.back { padding-left: 4px; }
.appbar.scrolled { background: var(--surface-container); }
.appbar h1 { flex: 1; min-width: 0; margin: 0; font: 400 22px/28px var(--font); letter-spacing: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.conn { flex: none; height: 24px; padding: 0 8px; border-radius: 8px; background: var(--error-container); color: var(--on-error-container); font-size: 12px; line-height: 24px; font-weight: 500; }
.views { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; }
.view { max-width: 960px; margin: 0 auto; padding: 8px 16px 32px; }
.view.fill { height: 100%; display: flex; flex-direction: column; padding-bottom: 0; }
@media (min-width: 600px) { .view { padding: 8px 24px 32px; } .appbar { padding-left: 24px; } .appbar.back { padding-left: 12px; } }
@media (max-width: 599px) {
  .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto; }
  .main { order: 1; }
  .rail { order: 2; flex-direction: row; justify-content: space-around; align-items: flex-start; gap: 0; padding: 12px 0 max(16px, env(safe-area-inset-bottom)); background: var(--surface-container); }
  .ni { flex: 1 1 0; min-width: 0; width: auto; }
  .ni span.nl { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
}
@media (max-width: 340px) { .ni .ind { width: 48px; } .ni { font-size: 11px; } }

/* icon button, buttons */
.ib { display: inline-grid; place-items: center; flex: none; width: 40px; height: 40px; border: 0; border-radius: 50%; background: transparent; color: var(--on-surface-variant); padding: 0; }
.ib.pri { background: var(--primary); color: var(--on-primary); }
.ib.tonal { background: var(--secondary-container); color: var(--on-secondary-container); }
.ib.err { color: var(--error); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 40px; padding: 0 24px; border: 0; border-radius: 20px; background: var(--primary); color: var(--on-primary); font-weight: 500; font-size: 14px; line-height: 20px; letter-spacing: .1px; text-decoration: none; white-space: nowrap; max-width: 100%; }
.btn svg.ic { width: 18px; height: 18px; margin-left: -8px; }
.btn.tonal { background: var(--secondary-container); color: var(--on-secondary-container); }
.btn.text { background: transparent; color: var(--primary); padding: 0 12px; }
.btn.text svg.ic { margin-left: 0; }
.btn.outlined { background: transparent; color: var(--primary); box-shadow: inset 0 0 0 1px var(--outline); }
.btn.danger { background: transparent; color: var(--error); padding: 0 12px; }
.btn.danger.fill { background: var(--error); color: var(--on-error); padding: 0 24px; }
.btns { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

/* cards, lists, tags, progress */
.col { display: flex; flex-direction: column; gap: 12px; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 12px; }
.card { position: relative; min-width: 0; border-radius: 12px; background: var(--surface-container); padding: 16px; overflow: hidden; }
.card.tap { cursor: pointer; }
.card.tap:focus-visible { outline-offset: -2px; }
.ch { display: flex; align-items: center; gap: 8px; min-height: 32px; margin-bottom: 8px; }
.ch h3 { flex: 1; min-width: 0; margin: 0; font: 500 16px/24px var(--font); letter-spacing: .15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ch .chev { color: var(--on-surface-variant); }
.big { font: 400 22px/28px var(--font); letter-spacing: 0; overflow-wrap: anywhere; }
.sup { color: var(--on-surface-variant); font-size: 14px; line-height: 20px; overflow-wrap: anywhere; }
.err-t { color: var(--error); }
.muted { color: var(--on-surface-variant); }
.empty { padding: 24px 16px; text-align: center; color: var(--on-surface-variant); }
.dot { flex: none; width: 10px; height: 10px; border-radius: 50%; background: var(--outline); }
.dot.ok { background: var(--ok); } .dot.warn { background: var(--warn); } .dot.err { background: var(--error); }
.dot.pri { background: var(--primary); animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .35; } }
@media (prefers-reduced-motion: reduce) { .dot.pri { animation: none; } * { transition: none !important; } }
.tag { display: inline-flex; align-items: center; flex: none; height: 24px; padding: 0 8px; border-radius: 8px; background: var(--surface-container-highest); color: var(--on-surface-variant); font-size: 12px; line-height: 16px; font-weight: 500; white-space: nowrap; max-width: 100%; }
.tag.ok { background: var(--ok-container); color: var(--on-ok-container); }
.tag.warn { background: var(--warn-container); color: var(--on-warn-container); }
.tag.err { background: var(--error-container); color: var(--on-error-container); }
.tag.pri { background: var(--primary-container); color: var(--on-primary-container); }
.row { display: flex; align-items: center; gap: 12px; min-width: 0; }
.row + .row { margin-top: 12px; }
.row .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.kv { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; font-size: 14px; }
.kv .k { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.kv .v { flex: none; color: var(--on-surface-variant); font-size: 12px; }
.bar { height: 4px; border-radius: 2px; background: var(--surface-container-highest); overflow: hidden; margin-top: 6px; }
.bar i { display: block; height: 100%; border-radius: 2px; background: var(--bar, var(--primary)); transition: width .3s; }
.bar.warn { --bar: var(--warn); } .bar.err { --bar: var(--error); }
.lim + .lim { margin-top: 14px; }
.sec { margin: 20px 0 8px 4px; color: var(--on-surface-variant); font: 500 14px/20px var(--font); letter-spacing: .1px; }
.sec:first-child { margin-top: 4px; }
.li { display: flex; align-items: center; gap: 16px; min-width: 0; padding: 12px 16px; border-radius: 12px; background: var(--surface-container); color: inherit; text-align: left; width: 100%; border: 0; }
.li + .li { margin-top: 8px; }
.li .lead { flex: none; color: var(--on-surface-variant); }
.li .tx { flex: 1; min-width: 0; }
.li .hd { font: 400 16px/24px var(--font); letter-spacing: .5px; overflow-wrap: anywhere; }
.avatar { flex: none; display: grid; place-items: center; width: 40px; height: 40px; border-radius: 50%; background: var(--primary-container); color: var(--on-primary-container); font: 500 16px/24px var(--font); text-transform: uppercase; }
.heads { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.heads .t { font: 500 16px/24px var(--font); letter-spacing: .15px; overflow-wrap: anywhere; }
.clamp { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.tools-bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }

/* chips */
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 4px 0 12px; min-width: 0; }
.chips::-webkit-scrollbar { display: none; }
.chip { display: inline-flex; align-items: center; gap: 8px; flex: none; height: 32px; padding: 0 16px; border: 0; border-radius: 8px; background: transparent; box-shadow: inset 0 0 0 1px var(--outline-variant); color: var(--on-surface-variant); font-weight: 500; font-size: 14px; max-width: 100%; }
.chip.on { background: var(--secondary-container); color: var(--on-secondary-container); box-shadow: none; padding-left: 8px; }
.chip svg.ic { width: 18px; height: 18px; }
.chip .tx { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* filled text field + select field */
.tf { position: relative; display: block; min-width: 0; background: var(--surface-container-highest); border-radius: 4px 4px 0 0; box-shadow: inset 0 -1px 0 var(--on-surface-variant); transition: box-shadow .15s; }
.tf:focus-within { box-shadow: inset 0 -2px 0 var(--primary); }
.tf input { display: block; width: 100%; height: 56px; padding: 24px 16px 8px; border: 0; outline: 0; background: transparent; border-radius: inherit; font-size: 16px; line-height: 24px; letter-spacing: .5px; }
.tf label, .tf .lb { position: absolute; left: 16px; top: 18px; max-width: calc(100% - 32px); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--on-surface-variant); font-size: 16px; line-height: 24px; pointer-events: none; transition: top .15s, font-size .15s, line-height .15s; }
.tf input:focus + label, .tf input:not(:placeholder-shown) + label, .tf .lb { top: 8px; font-size: 12px; line-height: 16px; }
.tf:focus-within label { color: var(--primary); }
.sel { display: flex; align-items: flex-end; gap: 8px; width: 100%; height: 56px; padding: 0 12px 8px 16px; border: 0; background: transparent; text-align: left; border-radius: inherit; }
.sel .val { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 16px; line-height: 24px; letter-spacing: .5px; }
.sel svg.ic { color: var(--on-surface-variant); margin-bottom: 0; }
.sel[aria-expanded="true"] { box-shadow: none; }
.tf:has(.sel[aria-expanded="true"]) { box-shadow: inset 0 -2px 0 var(--primary); }
.tf:has(.sel[aria-expanded="true"]) .lb { color: var(--primary); }
.lbl { margin: 16px 0 8px; font: 500 12px/16px var(--font); letter-spacing: .5px; color: var(--on-surface-variant); }
.lbl:first-child { margin-top: 0; }

/* custom menu (one component for every dropdown) */
.menu { position: fixed; z-index: 1000; display: flex; flex-direction: column; padding: 8px 0; overflow-y: auto; border-radius: 4px; background: var(--surface-container); box-shadow: 0 2px 6px 2px rgb(0 0 0 / .15), 0 1px 2px rgb(0 0 0 / .3); outline: 0; }
:root[data-theme="dark"] .menu { background: var(--surface-container-high); }
.menu .mh { z-index: 2; padding: 12px 16px 4px; color: var(--on-surface-variant); font: 500 12px/16px var(--font); letter-spacing: .5px; position: sticky; top: -8px; background: inherit; }
.mi { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 48px; padding: 8px 16px; border: 0; background: transparent; text-align: left; font-size: 16px; line-height: 24px; letter-spacing: .5px; }
.mi .ck { flex: none; width: 24px; height: 24px; color: var(--on-surface-variant); }
.mi .ml { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.mi .ml small { display: block; color: var(--on-surface-variant); font-size: 12px; line-height: 16px; }
.mi.sel-on { background: var(--secondary-container); color: var(--on-secondary-container); }
.mi.sel-on .ck { color: var(--on-secondary-container); }

/* segmented buttons */
.seg { display: grid; grid-template-columns: repeat(auto-fit, minmax(72px, 1fr)); border-radius: 12px; overflow: hidden; }
.seg button { display: flex; align-items: center; justify-content: center; gap: 6px; height: 40px; border: 0; background: transparent; box-shadow: 0 0 0 .5px var(--outline); color: var(--on-surface); font-weight: 500; font-size: 14px; padding: 0 8px; min-width: 0; }
.seg button.on { background: var(--secondary-container); color: var(--on-secondary-container); }
.seg button svg.ic { width: 18px; height: 18px; }

/* dialog + snackbar */
dialog.dlg { width: min(560px, calc(100vw - 32px)); max-height: calc(100dvh - 48px); margin: auto; padding: 24px; border: 0; border-radius: 28px; background: var(--surface-container-high); color: var(--on-surface); box-shadow: 0 6px 10px 4px rgb(0 0 0 / .15), 0 2px 3px rgb(0 0 0 / .3); overflow: auto; }
dialog.dlg::backdrop { background: var(--scrim); }
.dtitle { margin: 0 0 16px; font: 400 24px/32px var(--font); letter-spacing: 0; overflow-wrap: anywhere; }
.dbody { display: flex; flex-direction: column; gap: 16px; font-size: 14px; line-height: 20px; color: var(--on-surface-variant); }
.dbody p { margin: 0; overflow-wrap: anywhere; }
.dact { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; margin-top: 24px; }
.dact:empty { display: none; }
.snack { position: fixed; z-index: 2000; left: 50%; bottom: 24px; transform: translateX(-50%); width: max-content; max-width: calc(100vw - 32px); padding: 14px 16px; border-radius: 4px; background: var(--inverse-surface); color: var(--inverse-on-surface); font-size: 14px; line-height: 20px; box-shadow: 0 3px 5px rgb(0 0 0 / .2); overflow-wrap: anywhere; }
.snack.bad { background: var(--error-container); color: var(--on-error-container); }
@media (max-width: 599px) { .snack { bottom: 104px; } }

/* chat */
.timeline { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; display: flex; flex-direction: column; gap: 8px; padding: 4px 0 12px; }
.msg { align-self: flex-start; max-width: min(100%, 640px); padding: 10px 16px; border-radius: 16px 16px 16px 4px; background: var(--surface-container-high); overflow-wrap: anywhere; min-width: 0; }
.msg.me { align-self: flex-end; border-radius: 16px 16px 4px 16px; background: var(--primary-container); color: var(--on-primary-container); }
.msg.cmd { background: var(--surface-container); }
.mmeta { margin-bottom: 2px; font-size: 12px; line-height: 16px; color: var(--on-surface-variant); }
.msg.me .mmeta { color: inherit; opacity: .7; }
.msg pre, .box pre { margin: 6px 0 0; padding: 10px 12px; border-radius: 8px; background: var(--surface-container-highest); color: var(--on-surface); font-size: 12.5px; line-height: 18px; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 300px; overflow: auto; }
.msg pre:first-of-type { margin-top: 0; }
.msg pre.err, .box pre.err { color: var(--error); }
.md p { margin: 0 0 6px; } .md p:last-child { margin-bottom: 0; }
.md ul, .md ol { margin: 0 0 6px; padding-left: 22px; }
.md code { padding: 1px 5px; border-radius: 4px; background: var(--surface-container-highest); font-size: .92em; }
.md pre code { padding: 0; background: none; }
.composer { flex: none; padding: 4px 0 max(12px, env(safe-area-inset-bottom)); }
.composer .bar2 { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
.hintrow { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin-bottom: 8px; }
.hintrow::-webkit-scrollbar { display: none; }
.hintchip { flex: none; height: 32px; padding: 0 12px; border: 0; border-radius: 8px; background: var(--secondary-container); color: var(--on-secondary-container); font: 500 13px/20px var(--mono); }
.sendrow { display: flex; align-items: flex-end; gap: 4px; padding: 4px 4px 4px 20px; border-radius: 28px; background: var(--surface-container-high); }
.sendrow textarea { flex: 1; min-width: 0; resize: none; border: 0; outline: 0; background: transparent; padding: 12px 0; font-size: 16px; line-height: 24px; max-height: 140px; }
.sendrow .ib { width: 48px; height: 48px; }

/* activity */
.actbox { position: relative; flex: 1; min-height: 0; margin-bottom: max(12px, env(safe-area-inset-bottom)); }
.actlist { height: 100%; overflow-y: auto; overflow-x: hidden; padding: 8px; border-radius: 12px; background: var(--surface-container-low); }
.jump { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); box-shadow: 0 2px 6px rgb(0 0 0 / .25); }
.a-div { margin: 8px 4px; font-size: 12px; line-height: 16px; color: var(--on-surface-variant); text-align: center; overflow-wrap: anywhere; }
.a-text { padding: 8px 12px; overflow-wrap: anywhere; }
.a-time { font-size: 11px; color: var(--on-surface-variant); margin-right: 8px; }
.a-error { margin: 4px; padding: 8px 12px; border-radius: 8px; background: var(--error-container); color: var(--on-error-container); overflow-wrap: anywhere; }
details.box { margin: 4px 0; border-radius: 8px; background: var(--surface-container); }
details.box > summary { display: flex; align-items: center; gap: 8px; min-height: 40px; padding: 6px 12px; cursor: pointer; list-style: none; border-radius: 8px; font-size: 13px; line-height: 18px; }
details.box > summary::-webkit-details-marker { display: none; }
details.box > summary::before { content: ""; flex: none; width: 6px; height: 6px; border-right: 2px solid var(--on-surface-variant); border-bottom: 2px solid var(--on-surface-variant); transform: rotate(-45deg); transition: transform .15s; }
details.box[open] > summary::before { transform: rotate(45deg); }
.tname { flex: none; font-weight: 500; color: var(--primary); }
.tsum { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--on-surface-variant); }

    dlg && dlg.setActions(actions);
  }
  dlg = dialog({ title: "공급자 추가", body });
  paint();
}
async function startLogin(p) {
  let r;
  try { r = await api(`/api/providers/${enc(p.id)}/login`, "POST", {}); }
  catch (e) { toast(e.message, true); return; }
  const name = p.name || p.id;
  let finished = false, timer, dlg;
  const code = input({ type: "text" });
  const msg = el("p", { class: "err-t", hidden: true });
  const open = el("a", { class: "btn tonal", href: /^https?:\/\//.test(r.url || "") ? r.url : null, target: "_blank", rel: "noopener noreferrer" }, icon("open"), "로그인 페이지 열기");
  const stop = () => { clearTimeout(timer); };
  const success = async () => {
    finished = true; stop(); dlg.close();
    toast(`${name} 로그인했어요`);
    try { await loadProviderData(); } catch {}
    if (current === "providers") renderProviders();
    if (current === "home") renderHome();
    loadModels(true);
  };
  const fail = text => { msg.textContent = text; msg.hidden = false; };
  const poll = async () => {
    try {
      const s = await api(`/api/providers/${enc(p.id)}/login?login_id=${enc(r.login_id)}`);
      if (finished) return;
      if (s.status === "done") { success(); return; }
      if (s.status === "failed") { stop(); fail(s.error || "로그인에 실패했어요"); return; }
    } catch {}
    if (!finished) timer = setTimeout(poll, 2000);
  };
  const submit = btn => busy(btn, async () => {
    const v = code.value.trim();
    if (!v) { fail("코드나 주소를 붙여넣으세요"); return; }
    msg.hidden = true;
    stop();
    try { await api(`/api/providers/${enc(p.id)}/login/complete`, "POST", { login_id: r.login_id, code: v }); await success(); }
    catch (e) { fail(e.message); if (!finished) timer = setTimeout(poll, 2000); }
  });
  dlg = dialog({
    title: `${name} 로그인`,
    body: [el("div", {}, open), el("p", { text: "로그인 후 이동이 안 되면 주소창의 주소나 코드를 붙여넣으세요." }), textField("코드 또는 주소", code), msg],
    onclose: () => { stop(); if (!finished) api(`/api/providers/${enc(p.id)}/login`, "DELETE").catch(() => {}); },
    actions: [{ label: "취소", onclick: c => c() }, { label: "완료", kind: "tonal", onclick: (c, btn) => submit(btn) }],
  });
  code.addEventListener("keydown", ev => { if (ev.key === "Enter" && !ev.isComposing) { ev.preventDefault(); const b = dlg.node.querySelector(".dact .btn:last-child"); if (b) b.click(); } });
  timer = setTimeout(poll, 2000);
}

/* ---------- usage ---------- */
let quotaTimer;
async function loadQuota() {
  clearTimeout(quotaTimer);
  const box = $("#usage");
  let q;
  try { q = await api("/api/quota"); }
  catch (e) { clear(box).append(emptyNode("사용량을 불러오지 못했어요")); return; }
  if (current === "usage") quotaTimer = setTimeout(loadQuota, 60000);
  clear(box);
  box.append(el("div", { class: "tools-bar" }, el("span", { class: "sup", text: q.fetched_at ? kstStamp(q.fetched_at) : "" }),
    el("button", { class: "btn text", type: "button", onclick: ev => busy(ev.currentTarget, loadQuota) }, icon("refresh"), "새로고침")));
  for (const p of q.providers || []) {
    const card = el("div", { class: "card" }, el("div", { class: "ch" }, el("h3", { text: providerName(p.provider) })));
    for (const l of p.limits || []) {
      card.append(el("div", { class: "lim" },
        el("div", { class: "kv" }, el("span", { class: "k", text: l.label || l.id }), el("span", { style: "font-weight:500", text: pctText(l) })),
        bar(l),
        l.resets_at || l.window ? el("div", { class: "kv", style: "margin-top:4px" }, el("span", { class: "v", text: l.window || "" }), el("span", { class: "v", text: l.resets_at ? rel(l.resets_at) : "" })) : null));
    }
    if (!(p.limits || []).length) card.append(el("div", { class: "sup", text: "표시할 한도 없음" }));
    box.append(el("div", { style: "margin-bottom:12px" }, card));
  }
  if ((q.unavailable || []).length) {
    box.append(el("div", { class: "sec", text: "정보 없음" }));
    for (const u of q.unavailable) box.append(el("div", { class: "li", style: "display:block" }, el("div", { class: "hd", text: providerName(u.provider) }), el("div", { class: "sup", text: u.reason })));
  }
  if (!(q.providers || []).length && !(q.unavailable || []).length) box.append(emptyNode("사용량 정보 없음"));
}

/* ---------- settings ---------- */
function renderSettings() {
  const box = $("#settings");
  if (box.contains(document.activeElement) && openMenu) return;
  const om = M && M.orchestrator;
  const connected = P ? P.providers.filter(isConnected).length : null;
  const row = (ic, title, sub, onclick, trail) => { const b = el("button", { class: "li tap", type: "button", onclick: ev => onclick(ev.currentTarget) }, el("span", { class: "lead" }, icon(ic)), el("span", { class: "tx" }, el("div", { class: "hd", text: title }), sub ? el("div", { class: "sup", text: sub }) : null), trail === undefined ? icon("chev", "lead") : trail); return b; };
  const d = S && S.discord;
  clear(box).append(
    row("model", "모델", om ? modelName(om.model) : "", () => go("models")),
    row("key", "공급자", connected != null ? `${connected}개 연결` : "", () => go("providers")),
    row("usage", "사용량", "", () => go("usage")),
    row("context", "컨텍스트", "", () => go("context")),
    row("theme", "화면 모드", themeLabel(), b => themeMenu(b), icon("drop", "lead")),
    d && d.enabled ? el("div", { class: "li" }, el("span", { class: "lead" }, icon("discord")), el("span", { class: "tx" }, el("div", { class: "hd", text: "Discord" })), el("span", { class: `tag ${d.connected ? "ok" : "warn"}`, text: d.connected ? "연결됨" : "연결 중" })) : null);
}

/* ---------- boot ---------- */
(async () => {
  go(location.hash.slice(1) || "home");
  try {
    const s = await api("/api/state?limit=150");
    botName = s.name || botName;
    document.title = botName;
    s.events.forEach(addChat);
    scrollChat(true);
  } catch (e) { setConn(false); }
  await refreshState();
  loadModels(true);
  loadProviderData().then(() => { if (current === "home") renderHome(); }, () => {});
  loadSubs();
  let opened = false;
  const es = new EventSource("/api/events");
  es.onopen = () => { setConn(true); if (opened) { refreshState(); if (current === "activity") openActivity(); } opened = true; };
  es.onerror = () => setConn(false);
  es.onmessage = m => {
    let e;
    try { e = JSON.parse(m.data); } catch { return; }
    if (e.kind === "activity") onActivity(e);
    else if (e.kind === "subagents") setSubs(e.source, e.items);
    else { addChat(e); scheduleState(); }
  };
  setInterval(refreshState, 15000);
  setInterval(() => loadModels(true), 60000);
})();
</script>
