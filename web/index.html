<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f2f4f6">
<link rel="manifest" href="/manifest.webmanifest?v=2">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="dotz">
<title>dotz</title>
<script>
// Theme is applied before first paint: the saved light/dark choice, else the system setting (read only until the first toggle).
(() => {
  const mq = matchMedia("(prefers-color-scheme: dark)");
  const saved = () => { const v = localStorage.getItem("dotz-theme"); return v === "light" || v === "dark" ? v : null; };
  const get = () => saved() || (mq.matches ? "dark" : "light");
  const apply = () => {
    const dark = get() === "dark";
    document.documentElement.dataset.theme = dark ? "dark" : "light";
    const m = document.querySelector('meta[name="theme-color"]');
    if (m) m.content = dark ? "#121214" : "#f2f4f6";
    window.dispatchEvent(new Event("dotz-theme"));
  };
  mq.addEventListener("change", apply);
  window.dotzTheme = { get, toggle: () => { localStorage.setItem("dotz-theme", get() === "dark" ? "light" : "dark"); apply(); return get(); } };
  apply();
})();
</script>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="app" id="app">
  <aside class="side">
    <button class="brand" id="brand" type="button" aria-label="홈으로"><span class="logo"></span><span id="brand-name">dotz</span></button>
    <button class="cmdk" id="cmdk" type="button" aria-label="명령"></button>
    <nav class="rail" id="nav" aria-label="메뉴"></nav>
    <div class="pins" id="pins"></div>
    <div class="sfoot"><span class="dot" id="side-dot"></span><span id="side-st"></span></div>
  </aside>
  <div class="main">
    <header class="appbar" id="appbar">
      <button class="ib" id="back" type="button" aria-label="뒤로" hidden></button>
      <h1 id="title">dotz</h1>
      <div class="thead" id="thead" data-mode="chat" hidden></div>
      <span class="conn" id="conn" hidden>연결 끊김 · 다시 연결 중</span>
      <button class="ib" id="vtog" type="button" hidden></button>
      <button class="ib only-phone" id="pal" type="button" aria-label="명령"></button>
      <button class="ustrip" id="ustrip" type="button" hidden></button>
    </header>
    <div class="gban" id="gban" role="status" hidden><span class="dot" id="gban-dot"></span><span class="tx" id="gban-tx"></span><button class="x" id="gban-x" type="button" aria-label="재시작 알림 닫기">×</button></div>
    <div class="views" id="views">
      <section class="view" id="v-home" hidden><div id="home-now"></div><div class="sec" id="home-sec">상태</div><div id="home"></div><div id="home-custom"></div></section>
      <section class="view" id="v-project" hidden></section>
      <section class="view" id="v-projects" hidden></section>
      <section class="view fill" id="v-chat" hidden>
        <div class="subs" hidden></div>
        <div class="todo" id="todo" hidden></div>
        <div class="chatbox">
          <div class="timeline" id="timeline"><div class="tl-in" id="tl"></div></div>
          <button class="btn tonal jump" id="chat-jump" type="button" aria-label="맨 아래로" title="맨 아래로" hidden></button>
        </div>
        <div class="composer" id="composer">
          <section class="dcard" id="dcard" aria-label="답변 필요" hidden></section>
          <div class="qlist" id="queue" hidden></div>
          <div class="hintrow" id="hints" hidden></div>
          <div class="runline" id="runline" hidden><span class="dot pri"></span><span id="runline-tx"></span></div>
          <form class="sendrow" id="send">
            <div class="atray" id="atray" hidden></div>
            <input type="file" id="c-file" multiple hidden>
            <span class="prompt" aria-hidden="true">&gt;</span>
            <textarea id="text" rows="1" autocomplete="off" placeholder="메시지 또는 /명령" aria-label="메시지"></textarea>
            <div class="cbar" id="cbar">
              <button class="cchip" type="button" id="c-attach" aria-label="파일 첨부" title="파일 첨부 · 끌어다 놓거나 붙여넣기도 돼요"></button>
              <span class="cchip cown" id="c-own" hidden></span>
              <button class="cchip" type="button" id="c-model" aria-haspopup="listbox" hidden></button>
              <button class="cchip" type="button" id="c-effort" aria-haspopup="listbox" hidden></button>
              <span class="cchip cown" id="c-worker" hidden></span>
              <button class="cchip" type="button" id="ctx-ring" hidden></button>
              <div class="working" id="working" hidden><span class="dot pri"></span><span id="working-tx"></span><span class="sp"></span><button class="btn text" type="button" id="working-stop">중단</button></div>
            </div>
            <button class="ib pri" type="submit" aria-label="보내기" id="send-btn"></button>
          </form>
        </div>
      </section>
      <section class="view fill" id="v-activity" hidden>
        <div class="subs" hidden></div>
        <div class="termbox">
          <div class="term" id="term"></div>
          <button class="btn tonal jump" id="act-jump" type="button" aria-label="맨 아래로" title="맨 아래로" hidden></button>
        </div>
      </section>
      <section class="view" id="v-lanes" hidden><div id="lanes"></div><div id="lanes-ended"></div></section>
      <section class="view" id="v-harness" hidden><div id="harness"></div></section>
      <section class="view" id="v-settings" hidden><div id="settings"></div></section>
      <section class="view" id="v-models" hidden><div id="models"></div></section>
      <section class="view" id="v-providers" hidden><div id="providers"></div></section>
      <section class="view" id="v-usage" hidden><div id="usage"></div></section>
      <section class="view" id="v-context" hidden><div id="context"></div></section>
    </div>
  </div>
</div>
<aside class="sheet" id="sheet" role="dialog" aria-label="서브에이전트" hidden>
  <div class="sh-head">
    <button class="ib" id="sh-back" type="button" aria-label="목록으로" hidden></button>
    <div class="sh-t"><div class="sh-name" id="sh-name"></div><div class="sup" id="sh-sub"></div></div>
    <span class="tag" id="sh-tag"></span>
    <button class="ib" id="sh-close" type="button" aria-label="닫기"></button>
  </div>
  <div class="sh-body" id="sh-body"></div>
</aside>
<aside class="sheet" id="hsheet" role="dialog" aria-label="구성 상세" hidden>
  <div class="sh-head">
    <div class="sh-t"><div class="sh-name" id="hs-name"></div><div class="sup" id="hs-sub"></div></div>
    <span class="tag" id="hs-tag"></span>
    <button class="ib" id="hs-close" type="button" aria-label="닫기"></button>
  </div>
  <div class="sh-body" id="hs-body"></div>
</aside>
<script src="/app.js"></script>
<script src="/custom.js"></script>
</body>
</html>
